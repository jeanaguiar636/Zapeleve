<script type="module">
// Firebase config REAL do seu projeto zapleve
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzi_rystX7ymNbkeifTiO-YOxx2A9UCjI",
  authDomain: "zapleve.firebaseapp.com",
  projectId: "zapleve",
  storageBucket: "zapleve.firebasestorage.app",
  messagingSenderId: "426242600158",
  appId: "1:426242600158:web:09b519b9aa014667fc264f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// FUNÇÕES CORRIGIDAS - SEM onclick=""
async function entrar(){
  const email = $('email').value.trim();
  const senha = $('password').value.trim();
  const status = $('status-login');
  if(!email||!senha){ status.style.color='red'; status.textContent='Preencha e-mail e senha'; return; }
  status.style.color='#00a884'; status.textContent='Entrando...';
  try{
    await signInWithEmailAndPassword(auth,email,senha);
    status.textContent='';
  }catch(e){ 
    status.style.color='red';
    let msg = e.message;
    if(e.code==='auth/invalid-credential') msg='E-mail ou senha incorretos';
    if(e.code==='auth/user-not-found') msg='Usuário não existe, clique em Abrir Conta';
    if(e.code==='auth/wrong-password') msg='Senha errada';
    status.textContent = 'Erro: '+msg;
  }
}

async function cadastrar(){
  const email = $('email').value.trim();
  const senha = $('password').value.trim();
  const status = $('status-login');
  if(!email||!senha){ status.style.color='red'; status.textContent='Preencha e-mail e senha'; return; }
  if(senha.length < 6){ status.style.color='red'; status.textContent='Senha precisa ter 6+ caracteres'; return; }
  status.style.color='#00a884'; status.textContent='Criando conta...';
  try{
    const cred = await createUserWithEmailAndPassword(auth,email,senha);
    await setDoc(doc(db,"usuarios",cred.user.uid),{email, nome: email.split('@')[0], criadoEm: Date.now(), limiteProdutos:10});
    await setDoc(doc(db,"users",cred.user.uid),{email, nome: email.split('@')[0], criadoEm: Date.now()},{merge:true});
    status.style.color='#00a884'; status.textContent='✅ Conta criada! Entrando...';
  }catch(e){ status.style.color='red'; status.textContent='Erro: '+e.message; }
}

function alternarModoEscuro(){
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('zapleve_dark', document.body.classList.contains('dark-mode')?'1':'0');
}

// Expor no window para compatibilidade
window.entrar = entrar;
window.cadastrar = cadastrar;
window.alternarModoEscuro = alternarModoEscuro;

// LIGA TUDO POR addEventListener - FIM DO ReferenceError
$('btnEntrar').addEventListener('click', entrar);
$('btnCadastrar').addEventListener('click', cadastrar);
$('btnTema').addEventListener('click', alternarModoEscuro);
$('btnTema2').addEventListener('click', alternarModoEscuro);
$('btnSair').addEventListener('click', async()=>{ await signOut(auth); location.reload(); });
$('btnVoltar').addEventListener('click', ()=>{ $('chat-screen').classList.add('hidden'); $('contacts-screen').classList.remove('hidden'); });
$('btnSairChat').addEventListener('click', ()=>{ $('chat-screen').classList.add('hidden'); $('contacts-screen').classList.remove('hidden'); });
$('btnEnviar').addEventListener('click', ()=>{ 
  const txt = $('mensagem-texto').value.trim(); if(!txt) return;
  const box = $('mensagens'); const div = document.createElement('div'); div.className='msg msg-minha'; div.textContent=txt; box.appendChild(div); $('mensagem-texto').value=''; box.scrollTop=box.scrollHeight;
});
$('mensagem-texto').addEventListener('keypress', (e)=>{ if(e.key==='Enter') $('btnEnviar').click(); });
$('btnConvidar').addEventListener('click', async()=>{
  const link = location.origin;
  if(navigator.share){ try{ await navigator.share({title:'Zap Leve', url:link}); }catch(_){} } else { prompt('Copie o link:', link); }
});
$('areaMeuPerfil').addEventListener('click', ()=>{ $('modal-perfil-usuario').style.display='flex'; $('perfil-email-exibicao').textContent = auth.currentUser?.email || ''; });
$('btnFecharPerfil').addEventListener('click', ()=>{ $('modal-perfil-usuario').style.display='none'; });
$('btnSalvarPerfil').addEventListener('click', ()=>{ $('modal-perfil-usuario').style.display='none'; alert('Perfil salvo'); });
$('btnVitrine').addEventListener('click', ()=> alert('Vitrine'));
$('btnFecharDetalhe').addEventListener('click', ()=>{ $('modal-produto').style.display='none'; });
$('btnFalarVendedor').addEventListener('click', ()=> alert('Falar com vendedor'));
$('btnFecharLoja').addEventListener('click', ()=>{ $('loja-publica').classList.add('hidden'); });
$('modal-zoom-imagem').addEventListener('click', ()=>{ $('modal-zoom-imagem').style.display='none'; });

if(localStorage.getItem('zapleve_dark')==='1') document.body.classList.add('dark-mode');

// Auth observer
onAuthStateChanged(auth, (user)=>{
  if(user){
    $('auth-screen').classList.add('hidden');
    $('contacts-screen').classList.remove('hidden');
    $('user-display-contacts').textContent = user.email;
    $('meu-avatar-topo').textContent = user.email[0].toUpperCase();
    $('lista-contatos').innerHTML = '<p style="text-align:center; opacity:0.6; margin-top:20px;">✅ Logado como '+esc(user.email)+'<br><br>Nenhum contato ainda.<br>Clique em Convidar Amigo 📤</p>';
  }else{
    $('auth-screen').classList.remove('hidden');
    $('contacts-screen').classList.add('hidden');
    $('chat-screen').classList.add('hidden');
  }
});

// Limpa SW antigo que causava cache
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>{
      // mantém apenas se for o novo, remove velhos
      if(r.active && !r.active.scriptURL.includes('sw-novo')) r.unregister();
    });
  });
}

console.log('Zap Leve v2.2 pronto - entrar():', typeof entrar);

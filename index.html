<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zap Leve - Chat P2P</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00a884"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#fff;--text:#111;--head:#00a884;--chat:#efeae2;--input:#f0f2f5;--msg-eu:#d9fdd3;--msg-out:#fff;--border:#d1d7db}
body.dark{--bg:#111b21;--text:#e9edef;--head:#202c33;--chat:#0b141a;--input:#2a3942;--msg-eu:#005c4b;--msg-out:#202c33;--border:#222d34}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;height:100vh;height:100dvh;overflow:hidden}
.container{width:100%;max-width:480px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative}
.hidden{display:none!important}
.screen{flex:1;display:flex;flex-direction:column;padding:12px;overflow:hidden;width:100%;height:100%}
.logo{text-align:center;margin:20px 0} .logo h1{color:var(--head);margin:6px 0 0}
.btn-float{position:fixed;bottom:18px;right:16px;width:52px;height:52px;border-radius:50%;background:#27ae60;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:999;cursor:pointer}
input,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid var(--border);font-size:15px;outline:none;background:var(--input);color:var(--text)}
button{background:var(--head);color:#fff;border:none;font-weight:bold;cursor:pointer}
.header{display:flex;justify-content:space-between;align-items:center;background:var(--head);color:#fff;padding:10px 14px;flex-shrink:0}
.avatar{width:42px;height:42px;border-radius:50%;background:#075e54;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;overflow:hidden;flex-shrink:0} .avatar img{width:100%;height:100%;object-fit:cover}
.list{flex:1;overflow-y:auto} .item{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.chat{flex:1;overflow-y:auto;padding:12px;background:var(--chat);display:flex;flex-direction:column;gap:6px}
.msg{padding:8px 12px;border-radius:8px;max-width:85%;box-shadow:0 1px .5px rgba(0,0,0,.13)} .eu{background:var(--msg-eu);margin-left:auto} .out{background:var(--msg-out)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:center;padding:16px} .modal-box{background:var(--bg);padding:18px;border-radius:10px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto}
.card{border:1px solid var(--border);border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center;margin-bottom:8px} .card img{width:60px;height:60px;border-radius:6px;object-fit:cover;background:#eee}
</style>
</head>
<body>
<div class="container">
<div class="btn-float" id="btnVitrine">🛒</div>

<!-- LOJA -->
<div id="loja-publica" class="hidden" style="position:fixed;inset:0;z-index:1500;background:var(--bg);overflow-y:auto">
<div class="header"><div style="display:flex;gap:10px;align-items:center"><div id="lp-inicial" class="avatar">?</div><div><div id="lp-nome" style="font-weight:bold">Loja</div><div id="lp-bio" style="font-size:11px;opacity:.8"></div></div></div><button id="btnFecharLoja" style="width:auto;background:rgba(0,0,0,.3)">X</button></div>
<div id="lp-lista" style="padding:12px"></div></div>

<!-- AUTH - SEU LAYOUT ORIGINAL DA FOTO -->
<div id="auth-screen" class="screen" style="justify-content:center;max-width:380px;margin:0 auto">
<div class="logo"><div style="font-size:48px">⚡💬</div><h1>Zap Leve</h1><p style="font-size:13px;opacity:.6">Chat P2P e utilitários integrados</p></div>
<p id="aviso-convite" class="hidden" style="background:#e8f5e9;color:#1b5e20;padding:10px;border-radius:6px;font-size:12px;text-align:center;border:1px solid #a5d6a7"></p>
<input type="email" id="email" placeholder="Seu e-mail">
<input type="password" id="password" placeholder="Sua senha (6+ caracteres)">
<input type="text" id="username-cadastro" placeholder="Seu nome de usuário ex: rafa60 (só ao criar conta)" style="text-transform:lowercase">
<p id="preview-link" style="font-size:10px;opacity:.6;text-align:center;word-break:break-all;min-height:14px"></p>
<div style="display:flex;gap:8px"><button style="flex:1;background:#0275d8" id="btnEntrar">Entrar</button><button style="flex:1;background:#28a745" id="btnCadastrar">Abrir Conta</button></div>
<button style="background:#333;margin-top:8px" id="btnTema">🌓 Alternar Tema Claro / Escuro</button>
<p id="status-login" style="font-size:12px;text-align:center;min-height:16px;margin-top:8px"></p>
<p style="font-size:9px;opacity:.4;text-align:center;margin-top:12px">Github Pages + Firebase + Cloudflare R2 • sem faixa vermelha</p>
</div>

<!-- CONTATOS -->
<div id="contacts-screen" class="hidden screen" style="padding:0">
<div class="header"><div id="areaMeuPerfil" style="display:flex;gap:10px;align-items:center;cursor:pointer"><div id="meu-avatar-topo" class="avatar">?</div><div><div style="font-weight:bold">Zap Leve ⚡</div><div id="user-display-contacts" style="font-size:11px;opacity:.9"></div><div id="meu-link-indicacao" style="font-size:10px;color:#a5d6a7"></div></div></div><button id="btnSair" style="width:auto;background:#ea0038;padding:6px 10px;font-size:12px">Sair</button></div>
<div style="padding:12px;flex:1;display:flex;flex-direction:column;overflow:hidden">
<div class="list" id="lista-contatos"></div>
<div style="display:flex;gap:6px;margin-top:8px"><button style="flex:1;background:#005c4b;border-radius:20px" id="btnConvidar">📤 Convidar</button><button style="flex:1;background:#333;border-radius:20px" id="btnCopiarLink">🔗 Copiar link</button></div>
<input type="text" id="input-link-compartilhar" readonly style="font-size:11px;text-align:center;margin-top:6px">
</div></div>

<!-- CHAT -->
<div id="chat-screen" class="hidden screen" style="padding:0">
<div class="header"><div style="display:flex;gap:8px;align-items:center"><span id="btnVoltar" style="text-decoration:underline;cursor:pointer;font-weight:bold">voltar</span><div id="chat-avatar-topo" class="avatar">?</div><div id="chat-nome-topo" style="font-weight:bold;font-size:14px">Chat</div></div><div style="display:flex;gap:4px"><button id="btnCallAudio" style="width:auto;padding:6px 8px;background:rgba(0,0,0,.2)">📞</button><button id="btnCallVideo" style="width:auto;padding:6px 8px;background:rgba(0,0,0,.2)">📹</button><button id="btnSairChat" style="width:auto;background:#ea0038;padding:6px 10px;font-size:12px">Sair</button></div></div>
<div class="chat" id="mensagens"></div>
<div style="display:flex;gap:6px;padding:8px;background:var(--input);border-top:1px solid var(--border);align-items:center">
<button id="btnAttachImg" style="width:auto;background:transparent;color:var(--text);font-size:20px">📎</button>
<input type="text" id="mensagem-texto" placeholder="Mensagem..." style="margin:0;border-radius:20px;flex:1">
<button id="btnAudio" style="width:auto;background:transparent;color:var(--text);font-size:18px">🎤</button>
<button id="btnEnviar" style="width:auto;border-radius:20px;padding:10px 16px">Enviar</button>
</div><input type="file" id="fileImgChat" accept="image/*,video/*" class="hidden">
</div>

<!-- PERFIL -->
<div id="modal-perfil-usuario" class="modal"><div class="modal-box" style="text-align:center">
<h3>Meu Perfil</h3><div id="perfil-foto-preview" class="avatar" style="width:80px;height:80px;margin:0 auto 10px;font-size:28px">?</div>
<input type="file" id="input-foto-perfil" accept="image/*">
<input type="text" id="input-perfil-nome" placeholder="Seu nome">
<input type="text" id="input-perfil-username" placeholder="username ex: rafa60" style="text-transform:lowercase">
<textarea id="input-perfil-bio" placeholder="Bio / Recado" style="min-height:60px;resize:none"></textarea>
<p id="status-perfil" style="font-size:11px"></p>
<button style="background:#28a745" id="btnSalvarPerfil">💾 Salvar Perfil</button>
<button style="background:#888;margin-top:6px" id="btnFecharPerfil">Fechar</button>
</div></div>

<!-- CATALOGO -->
<div id="modal-catalogo" class="modal"><div class="modal-box">
<h3>Meu Catálogo</h3><p style="font-size:11px;opacity:.6">Foto + nome + preço + link afiliado. Vai pro R2/Firebase.</p>
<input type="file" id="input-prod-foto" accept="image/*">
<input type="text" id="input-prod-nome" placeholder="Nome do produto">
<input type="text" id="input-prod-preco" placeholder="Preço ex: R$ 99,90">
<input type="text" id="input-prod-afiliado" placeholder="Link afiliado https://...">
<p id="status-prod" style="font-size:11px"></p>
<button style="background:#28a745" id="btnSalvarProduto">+ Salvar Produto</button>
<div id="lista-meus-produtos" style="margin-top:12px;max-height:35vh;overflow-y:auto"></div>
<button style="background:#888;margin-top:10px" id="btnFecharCatalogo">Fechar</button>
</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, getDocs, addDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

// === CONFIG GITHUB PAGES + FIREBASE + R2 ===
const TOQUE_R2_URL = ""; // opcional: cole seu link do R2 https://pub-xxxx.r2.dev/toque.mp3
const firebaseConfig = {
  apiKey: "AIzaSyDzi_rystX7ymNbkeifTiO-YOxx2A9UCjI",
  authDomain: "zapleve.firebaseapp.com",
  projectId: "zapleve",
  storageBucket: "zapleve.firebasestorage.app",
  messagingSenderId: "426242600158",
  appId: "1:426242600158:web:09b519b9aa014667fc264f"
};
const app = initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app); const storage=getStorage(app);
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const slug=t=>String(t).toLowerCase().trim().replace(/[^a-z0-9]+/g,'').slice(0,20);
let currentData=null, chatCom=null;

// CONVITE ?ref=
const refParam = new URL(location.href).searchParams.get('ref')||''; if(refParam){ localStorage.setItem('zapleve_ref', slug(refParam)); $('aviso-convite').classList.remove('hidden'); $('aviso-convite').innerHTML=`🎉 Convite de <b>@${esc(slug(refParam))}</b>!`; }
$('username-cadastro').addEventListener('input', ()=>{ const s=slug($('username-cadastro').value)||slug($('email').value.split('@')[0])||'seunome'; $('preview-link').textContent=`Seu link: ${location.origin}${location.pathname.replace('index.html','')}?ref=${s}`; });

// FUNÇÕES CORRIGIDAS - SEM FAIXA VERMELHA
async function entrar(){
  const email=$('email').value.trim(), senha=$('password').value.trim(), st=$('status-login');
  if(!email||!senha){ st.style.color='red'; st.textContent='Preencha email e senha'; return; }
  st.style.color='#00a884'; st.textContent='Entrando...';
  try{ await signInWithEmailAndPassword(auth,email,senha); st.textContent=''; }
  catch(e){ st.style.color='red'; let m=e.message; if(e.code==='auth/invalid-credential') m='Email ou senha errados'; if(e.code==='auth/user-not-found') m='Não existe, clique Abrir Conta'; st.textContent='Erro: '+m; }
}
async function cadastrar(){
  const email=$('email').value.trim(), senha=$('password').value.trim(), uRaw=$('username-cadastro').value.trim(), st=$('status-login');
  const username=slug(uRaw)||slug(email.split('@')[0]);
  if(!email||!senha||!username){ st.style.color='red'; st.textContent='Email, senha e username'; return; }
  if(senha.length<6){ st.style.color='red'; st.textContent='Senha 6+'; return; }
  st.style.color='#00a884'; st.textContent='Criando...';
  try{
    const q=query(collection(db,"usuarios"), where("username","==",username)); const s=await getDocs(q); if(!s.empty){ st.style.color='red'; st.textContent='@'+username+' já existe'; return; }
    const cred=await createUserWithEmailAndPassword(auth,email,senha);
    const dados={ email, username, nome:username, displayName:username, bio:'', photoURL:'', referralCode:username, indicadoPor:localStorage.getItem('zapleve_ref')||null, criadoEm:Date.now() };
    await setDoc(doc(db,"usuarios",cred.user.uid), dados); await setDoc(doc(db,"users",cred.user.uid), dados, {merge:true});
    localStorage.removeItem('zapleve_ref'); st.style.color='green'; st.textContent='✅ Conta @'+username+' criada!';
  }catch(e){ st.style.color='red'; st.textContent='Erro: '+e.message; }
}
$('btnEntrar').addEventListener('click', entrar);
$('btnCadastrar').addEventListener('click', cadastrar);
$('btnTema').addEventListener('click', ()=>{ document.body.classList.toggle('dark'); localStorage.setItem('zapleve_dark', document.body.classList.contains('dark')?'1':'0'); });
if(localStorage.getItem('zapleve_dark')==='1') document.body.classList.add('dark');

function atualizarTela(){
  if(!currentData) return;
  const link=`${location.origin}${location.pathname.replace('index.html','')}?ref=${currentData.username}`;
  $('user-display-contacts').textContent='@'+currentData.username+(currentData.bio?' | '+currentData.bio:''); $('meu-link-indicacao').textContent='?ref='+currentData.username; $('input-link-compartilhar').value=link;
  const av=$('meu-avatar-topo'); av.innerHTML=''; if(currentData.photoURL){ const im=document.createElement('img'); im.src=currentData.photoURL; av.appendChild(im); } else av.textContent=currentData.username[0].toUpperCase();
  carregarContatos();
}
async function carregarContatos(){
  const lista=$('lista-contatos'); lista.innerHTML='Carregando...'; const q=query(collection(db,"usuarios"), orderBy("criadoEm","desc")); const snap=await getDocs(q);
  lista.innerHTML=''; snap.forEach(d=>{ const u=d.data(); if(u.username===currentData.username) return; const div=document.createElement('div'); div.className='item'; const av=u.photoURL?`<div class="avatar"><img src="${esc(u.photoURL)}"></div>`:`<div class="avatar">${esc((u.username||'?')[0].toUpperCase())}</div>`; div.innerHTML=`<div style="display:flex;gap:10px;align-items:center">${av}<div><b style="font-size:13px">@${esc(u.username)}</b><br><span style="font-size:11px;opacity:.6">${esc(u.bio||'sem recado')}</span></div></div><span>🛒</span>`; div.addEventListener('click', ()=>{ chatCom=u; $('contacts-screen').classList.add('hidden'); $('chat-screen').classList.remove('hidden'); $('chat-nome-topo').textContent='@'+u.username; const av2=$('chat-avatar-topo'); av2.innerHTML=''; if(u.photoURL){ const im=document.createElement('img'); im.src=u.photoURL; av2.appendChild(im); } else av2.textContent=u.username[0].toUpperCase(); $('mensagens').innerHTML=`<div style="text-align:center;font-size:11px;opacity:.5;padding:8px">Conversa com @${esc(u.username)}<br><button onclick="abrirLoja('${esc(u.username)}')" style="width:auto;padding:6px 10px;font-size:11px;background:#27ae60;border-radius:12px;margin-top:6px">🛒 Ver catálogo</button></div>`; }); lista.appendChild(div); });
  if(!lista.children.length) lista.innerHTML=`<p style="text-align:center;opacity:.5;padding:20px">Nenhum contato<br>Compartilhe ?ref=${esc(currentData.username)}</p>`;
}

// PERFIL
$('areaMeuPerfil').addEventListener('click', ()=>{ $('input-perfil-nome').value=currentData.displayName||''; $('input-perfil-username').value=currentData.username||''; $('input-perfil-bio').value=currentData.bio||''; const av=$('perfil-foto-preview'); av.innerHTML=''; if(currentData.photoURL){ const im=document.createElement('img'); im.src=currentData.photoURL; av.appendChild(im); } else av.textContent=currentData.username[0].toUpperCase(); $('modal-perfil-usuario').style.display='flex'; });
$('btnFecharPerfil').addEventListener('click', ()=>$('modal-perfil-usuario').style.display='none');
$('input-foto-perfil').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ const av=$('perfil-foto-preview'); av.innerHTML=''; const im=document.createElement('img'); im.src=ev.target.result; av.appendChild(im); }; r.readAsDataURL(f); });
$('btnSalvarPerfil').addEventListener('click', async()=>{
  const st=$('status-perfil'), user=auth.currentUser; if(!user) return; const nome=$('input-perfil-nome').value.trim(), username=slug($('input-perfil-username').value.trim()), bio=$('input-perfil-bio').value.trim().slice(0,140);
  if(!username){ st.textContent='username obrigatório'; return; } st.textContent='Salvando...';
  try{
    if(username!==currentData.username){ const q=query(collection(db,"usuarios"), where("username","==",username)); const s=await getDocs(q); if(!s.empty){ st.textContent='@'+username+' já existe'; return; } }
    let photoURL=currentData.photoURL||''; const file=$('input-foto-perfil').files[0]; if(file){ const rf=ref(storage, `perfil/${user.uid}/${Date.now()}.jpg`); await uploadBytes(rf,file); photoURL=await getDownloadURL(rf); }
    const upd={ displayName:nome||username, nome:nome||username, username, bio, photoURL }; await updateDoc(doc(db,"usuarios",user.uid), upd); await setDoc(doc(db,"users",user.uid), upd, {merge:true});
    currentData={...currentData,...upd}; st.textContent='✅ Salvo!'; setTimeout(()=>{ $('modal-perfil-usuario').style.display='none'; atualizarTela(); },600);
  }catch(e){ st.textContent='Erro: '+e.message; }
});

// CHAT + AUDIO + VIDEO + IMAGEM + CHAMADA
$('btnVoltar').addEventListener('click', ()=>{ $('chat-screen').classList.add('hidden'); $('contacts-screen').classList.remove('hidden'); });
$('btnSairChat').addEventListener('click', ()=>{ $('chat-screen').classList.add('hidden'); $('contacts-screen').classList.remove('hidden'); });
$('btnSair').addEventListener('click', async()=>{ await signOut(auth); location.reload(); });
$('btnEnviar').addEventListener('click', ()=>{ const txt=$('mensagem-texto').value.trim(); if(!txt) return; const b=$('mensagens'); const d=document.createElement('div'); d.className='msg eu'; d.textContent=txt; b.appendChild(d); $('mensagem-texto').value=''; b.scrollTop=b.scrollHeight; });
$('mensagem-texto').addEventListener('keypress', e=>{ if(e.key==='Enter') $('btnEnviar').click(); });
$('btnAttachImg').addEventListener('click', ()=>$('fileImgChat').click());
$('fileImgChat').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const url=URL.createObjectURL(f); const b=$('mensagens'); const d=document.createElement('div'); d.className='msg eu'; d.innerHTML=f.type.startsWith('video')?`<video src="${url}" controls style="max-width:100%;border-radius:6px"></video>`:`<img src="${url}" style="max-width:100%;border-radius:6px">`; b.appendChild(d); b.scrollTop=b.scrollHeight; e.target.value=''; });
$('btnCallAudio').addEventListener('click', ()=>{ if(chatCom) alert('📞 Chamando @'+chatCom.username+' por áudio P2P...'); });
$('btnCallVideo').addEventListener('click', ()=>{ if(chatCom) alert('📹 Chamando @'+chatCom.username+' por vídeo P2P...'); });
$('btnAudio').addEventListener('click', async()=>{ try{ const stream=await navigator.mediaDevices.getUserMedia({audio:true}); const mr=new MediaRecorder(stream); const chunks=[]; mr.ondataavailable=e=>chunks.push(e.data); mr.onstop=()=>{ const blob=new Blob(chunks,{type:'audio/webm'}); const url=URL.createObjectURL(blob); const b=$('mensagens'); const d=document.createElement('div'); d.className='msg eu'; d.innerHTML=`<audio controls src="${url}"></audio>`; b.appendChild(d); b.scrollTop=b.scrollHeight; stream.getTracks().forEach(t=>t.stop()); }; mr.start(); setTimeout(()=>{ if(mr.state==='recording') mr.stop(); }, 30000); const stop=()=>{ if(mr.state==='recording') mr.stop(); }; $('btnAudio').onclick=stop; setTimeout(()=>{ $('btnAudio').onclick=null; }, 31000); }catch{ alert('Microfone bloqueado'); } });
$('btnConvidar').addEventListener('click', async()=>{ const l=$('input-link-compartilhar').value; if(navigator.share){ try{ await navigator.share({title:'Zap Leve', url:l}); }catch{} } else prompt('Copie:', l); });
$('btnCopiarLink').addEventListener('click', async()=>{ const l=$('input-link-compartilhar').value; try{ await navigator.clipboard.writeText(l); alert('Copiado!'); }catch{ prompt('Copie:', l); } });

// CATALOGO
$('btnVitrine').addEventListener('click', ()=>{ $('modal-catalogo').style.display='flex'; carregarMeusProds(); });
$('btnFecharCatalogo').addEventListener('click', ()=>$('modal-catalogo').style.display='none');
$('btnSalvarProduto').addEventListener('click', async()=>{
  const st=$('status-prod'), user=auth.currentUser; if(!user) return; const nome=$('input-prod-nome').value.trim(), preco=$('input-prod-preco').value.trim(), link=$('input-prod-afiliado').value.trim(), file=$('input-prod-foto').files[0];
  if(!nome||!preco){ st.textContent='Nome e preço'; return; } st.textContent='Salvando...';
  try{ let foto=''; if(file){ const r=ref(storage, `produtos/${user.uid}/${Date.now()}_${file.name}`); await uploadBytes(r,file); foto=await getDownloadURL(r); } await addDoc(collection(db,"produtos"), {ownerId:user.uid, username:currentData.username, nome, preco, afiliadoLink:link, fotoUrl:foto, criadoEm:Date.now()}); st.textContent='✅ Salvo!'; $('input-prod-nome').value=''; $('input-prod-preco').value=''; $('input-prod-afiliado').value=''; $('input-prod-foto').value=''; carregarMeusProds(); }catch(e){ st.textContent='Erro: '+e.message; }

async function carregarMeusProds(){
  const lista=$('lista-meus-produtos'), user=auth.currentUser; if(!user) return; lista.innerHTML='Carregando...'; const q=query(collection(db,"produtos"), where("ownerId","==",user.uid), orderBy("criadoEm","desc")); const snap=await getDocs(q); lista.innerHTML=''; if(snap.empty){ lista.innerHTML='<p style="font-size:12px;opacity:.5">Nenhum produto</p>'; return; } snap.forEach(d=>{ const p=d.data(); const id=d.id; const div=document.createElement('div'); div.className='card'; div.innerHTML=`<img src="${esc(p.fotoUrl||'https://via.placeholder.com/60')}"><div style="flex:1"><b style="font-size:13px">${esc(p.nome)}</b><br><span style="color:#27ae60;font-weight:bold">${esc(p.preco)}</span></div><button style="width:auto;background:#ea0038;padding:6px 8px" data-del="${id}">X</button>`; lista.appendChild(div); }); lista.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async e=>{ if(confirm('Excluir?')){ await deleteDoc(doc(db,"produtos",e.target.getAttribute('data-del'))); carregarMeusProds(); } })); 
}
window.abrirLoja=async(username)=>{
  $('loja-publica').classList.remove('hidden'); $('lp-nome').textContent='@'+username; const lista=$('lp-lista'); lista.innerHTML='Carregando...'; const qUser=query(collection(db,"usuarios"), where("username","==",username)); const sUser=await getDocs(qUser); if(!sUser.empty){ const u=sUser.docs[0].data(); $('lp-nome').textContent='@'+u.username+' - '+(u.displayName||''); $('lp-bio').textContent=u.bio||''; const av=$('lp-inicial'); av.innerHTML=''; if(u.photoURL){ const im=document.createElement('img'); im.src=u.photoURL; av.appendChild(im); } else av.textContent=u.username[0].toUpperCase(); } const q=query(collection(db,"produtos"), where("username","==",username), orderBy("criadoEm","desc")); const snap=await getDocs(q); lista.innerHTML=''; if(snap.empty){ lista.innerHTML='<p style="text-align:center;opacity:.5">Nenhum produto</p>'; return; } snap.forEach(d=>{ const p=d.data(); const div=document.createElement('div'); div.className='card'; div.innerHTML=`<img src="${esc(p.fotoUrl||'https://via.placeholder.com/60')}" style="width:70px;height:70px"><div style="flex:1"><b>${esc(p.nome)}</b><br><span style="color:#27ae60;font-weight:bold">${esc(p.preco)}</span><br>${p.afiliadoLink?`<a href="${esc(p.afiliadoLink)}" target="_blank"><button style="padding:6px 10px;font-size:11px;background:#ff6a00;width:auto;border-radius:12px">🛒 Comprar</button></a>`:''}</div>`; lista.appendChild(div); });
};
$('btnFecharLoja').addEventListener('click', ()=>$('loja-publica').classList.add('hidden'));

onAuthStateChanged(auth, async(user)=>{
  if(user){ $('auth-screen').classList.add('hidden'); $('contacts-screen').classList.remove('hidden'); const snap=await getDoc(doc(db,"usuarios",user.uid)); if(snap.exists()){ currentData=snap.data(); atualizarTela(); } }
  else{ $('auth-screen').classList.remove('hidden'); $('contacts-screen').classList.add('hidden'); $('chat-screen').classList.add('hidden'); }
});

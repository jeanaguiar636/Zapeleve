<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zap Leve - Chat</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00a884">
<style>
:root{--bg:#fff;--text:#111;--head:#00a884;--input:#f0f2f5;--border:#e9edef;--chat:#efeae2;--msg-eu:#d9fdd3;--msg-outro:#fff}
body.dark-mode{--bg:#111b21;--text:#e9edef;--head:#202c33;--input:#2a3942;--border:#222d34;--chat:#0b141a;--msg-eu:#005c4b;--msg-outro:#202c33}
*{box-sizing:border-box}body{font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;background:var(--bg);color:var(--text);margin:0;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;overflow:hidden}
.container{width:100%;max-width:480px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.hidden{display:none!important}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100%}
.header{height:56px;display:flex;align-items:center;justify-content:space-between;background:var(--head);color:#fff;padding:0 10px;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:#075e54;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.icon-btn{background:transparent;border:none;color:#fff;font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:rgba(0,0,0,.2)}
input,textarea{border:none;outline:none;background:var(--input);color:var(--text);font-size:15px}
.chat-box{flex:1;overflow-y:auto;padding:10px 8px;background:var(--chat);display:flex;flex-direction:column;gap:6px;background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: var(--chat);}
body.dark-mode .chat-box{background-image:none}
.msg{padding:6px 8px 4px 8px;border-radius:7.5px;max-width:78%;font-size:14.2px;line-height:19px;box-shadow:0 1px .5px rgba(0,0,0,.13);position:relative;word-break:break-word}
.msg-outro{background:var(--msg-outro);align-self:flex-start;border-top-left-radius:0}
.msg-eu{background:var(--msg-eu);align-self:flex-end;border-top-right-radius:0}
.msg img{max-width:100%;border-radius:6px;margin-top:4px;cursor:pointer}
.msg video{max-width:100%;border-radius:6px;margin-top:4px}
.msg .hora{font-size:10px;opacity:.6;float:right;margin-left:8px;margin-top:4px}
.input-area{display:flex;align-items:flex-end;gap:6px;padding:6px 8px;background:var(--input);border-top:1px solid var(--border)}
.input-area .attach{font-size:20px;background:transparent;border:none;cursor:pointer;color:#54656f;width:32px}
.input-area .campo{flex:1;background:var(--bg);border-radius:20px;padding:9px 14px;min-height:40px;max-height:100px;overflow-y:auto;border:1px solid var(--border)}
.input-area .send{background:var(--head);color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0}
.contact-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.contact-item:active{background:var(--input)}
.contact-info{flex:1;min-width:0}
.contact-info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-info span{font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.footer-discreto{padding:6px 10px;border-top:1px solid var(--border);background:var(--bg);display:flex;align-items:center;gap:6px}
.footer-discreto input{flex:1;font-size:11px;background:transparent;border:1px dashed var(--border);border-radius:12px;padding:6px 10px;text-align:center}
.footer-discreto button{width:auto;padding:6px 10px;font-size:11px;border-radius:12px;background:var(--input);color:var(--text);border:1px solid var(--border)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}
.modal-content{background:var(--bg);width:100%;max-width:380px;border-radius:12px;padding:16px;max-height:90vh;overflow-y:auto}
.prod-mini{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--border);align-items:center}
.prod-mini img{width:48px;height:48px;border-radius:6px;object-fit:cover;background:#eee}
.fab-discreto{position:absolute;bottom:70px;right:14px;width:46px;height:46px;border-radius:50%;background:#25d366;color:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:20px;z-index:500;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>
<div class="container">

<!-- AUTH - SÓ EMAIL E SENHA, NOME SÓ AO CRIAR -->
<div id="auth-screen" class="screen" style="justify-content:center;padding:20px;max-width:360px;margin:0 auto">
<div style="text-align:center;margin-bottom:16px"><div style="font-size:42px">⚡💬</div><h2 style="color:var(--head);margin:6px 0">Zap Leve</h2><p style="font-size:12px;opacity:.6">Chat P2P com chamada</p></div>
<p id="aviso-convite" class="hidden" style="background:#e8f5e9;color:#1b5e20;padding:8px;border-radius:8px;font-size:12px;text-align:center"></p>
<input type="email" id="email" placeholder="E-mail" style="padding:12px;border-radius:8px;margin:6px 0;width:100%;background:var(--input)">
<input type="password" id="password" placeholder="Senha" style="padding:12px;border-radius:8px;margin:6px 0;width:100%;background:var(--input)">
<div id="box-cadastro" class="hidden">
<input type="text" id="username-cadastro" placeholder="Nome de usuário (ex: rafa60)" style="padding:12px;border-radius:8px;margin:6px 0;width:100%;background:var(--input);text-transform:lowercase">
<p id="preview-link" style="font-size:10px;opacity:.5;text-align:center"></p>
</div>
<div style="display:flex;gap:8px;margin-top:8px"><button id="btnEntrar" style="flex:1;background:var(--head);color:#fff;padding:12px;border-radius:8px;border:none;font-weight:bold">Entrar</button><button id="btnCadastrar" style="flex:1;background:#25d366;color:#fff;padding:12px;border-radius:8px;border:none;font-weight:bold">Abrir Conta</button></div>
<p id="link-toggle" style="font-size:12px;text-align:center;color:var(--head);text-decoration:underline;cursor:pointer;margin-top:10px">Não tem conta? Criar com nome de usuário</p>
<p id="status-login" style="font-size:11px;text-align:center;min-height:14px;margin-top:8px"></p>
<p style="font-size:9px;opacity:.3;text-align:center">v4.1 chat discreto - volta chamada</p>
</div>

<!-- CONTATOS - IGUAL WHATSAPP ANTIGO -->
<div id="contacts-screen" class="hidden screen">
<div class="header"><div class="header-left" id="areaMeuPerfil" style="cursor:pointer"><div id="meu-avatar" class="avatar">?</div><div><div id="meu-nome" style="font-weight:bold;font-size:15px">Zap Leve</div><div id="meu-bio-topo" style="font-size:11px;opacity:.8;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div></div><div style="display:flex;gap:2px"><button class="icon-btn" id="btnAbrirCatalogo" title="Meu catálogo">🛒</button><button class="icon-btn" id="btnTema">🌓</button><button class="icon-btn" id="btnSair">⎋</button></div></div>
<div id="lista-contatos" style="flex:1;overflow-y:auto"></div>
<!-- COMPARTILHAR DISCRETO LÁ EMBAIXO, ANTES DO CAMPO ANTIGO -->
<div class="footer-discreto"><input type="text" id="input-link" readonly placeholder="Seu link ?ref=..."><button id="btnCopiarLink">🔗 Copiar</button><button id="btnShare">📤</button></div>
</div>

<!-- CHAT - COM CHAMADA DE VIDEO, AUDIO, IMAGEM, VIDEO, AUDIO -->
<div id="chat-screen" class="hidden screen">
<div class="header"><div class="header-left"><button class="icon-btn" id="btnVoltar">‹</button><div id="chat-avatar" class="avatar">?</div><div><div id="chat-nome" style="font-weight:bold;font-size:15px">Chat</div><div id="chat-status" style="font-size:11px;opacity:.8">toque para ver perfil</div></div></div><div style="display:flex;gap:2px"><button class="icon-btn" id="btnCallAudio" title="Chamada de áudio">📞</button><button class="icon-btn" id="btnCallVideo" title="Chamada de vídeo">📹</button><button class="icon-btn" id="btnVerCatalogoContato" title="Ver catálogo">🛒</button></div></div>
<div class="chat-box" id="mensagens"></div>
<!-- CAMPO DE MENSAGENS IGUAL ANTIGO, COM BOTÕES DISCRETOS -->
<div class="input-area">
<button class="attach" id="btnAttachImg" title="Enviar imagem">📎</button>
<button class="attach" id="btnAttachVideo" title="Enviar vídeo">🎥</button>
<div id="campo-msg" class="campo" contenteditable="true" data-placeholder="Mensagem..."></div>
<button class="attach" id="btnAudio" title="Áudio">🎤</button>
<button class="send" id="btnEnviar">➤</button>
</div>
<input type="file" id="fileImg" accept="image/*" class="hidden">
<input type="file" id="fileVideo" accept="video/*" class="hidden">
</div>

<!-- PERFIL - BIO + FOTO IGUAL WHATSAPP -->
<div id="modal-perfil" class="modal"><div class="modal-content" style="text-align:center">
<div id="perfil-foto-grande" class="avatar" style="width:88px;height:88px;margin:0 auto 10px;font-size:32px">?</div>
<input type="file" id="input-foto" accept="image/*" style="font-size:12px">
<input type="text" id="input-nome-perfil" placeholder="Seu nome" style="padding:10px;border-radius:8px;margin:6px 0;width:100%;background:var(--input)">
<input type="text" id="input-user-perfil" placeholder="Nome de usuário" style="padding:10px;border-radius:8px;margin:6px 0;width:100%;background:var(--input);text-transform:lowercase">
<textarea id="input-bio-perfil" placeholder="Recado / Bio - ex: Disponível, vendo produtos..." style="padding:10px;border-radius:8px;margin:6px 0;width:100%;background:var(--input);min-height:60px;resize:none"></textarea>
<p id="status-perfil" style="font-size:11px;min-height:12px"></p>
<button id="btnSalvarPerfil" style="background:var(--head);color:#fff;padding:10px;border-radius:8px;border:none;width:100%;font-weight:bold">Salvar perfil</button>
<button id="btnFecharPerfil" style="background:#888;color:#fff;padding:10px;border-radius:8px;border:none;width:100%;margin-top:6px">Fechar</button>
</div></div>

<!-- CATALOGO DISCRETO -->
<div id="modal-catalogo" class="modal"><div class="modal-content">
<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0;color:var(--head)">Meu Catálogo</h3><button id="btnFecharCatalogo" style="width:auto;background:transparent;color:var(--text);font-size:20px;border:none">✕</button></div>
<div style="display:flex;gap:6px;margin-top:10px"><input type="file" id="prod-foto" accept="image/*" style="font-size:11px"><input type="text" id="prod-nome" placeholder="Nome" style="flex:1"></div>
<div style="display:flex;gap:6px"><input type="text" id="prod-preco" placeholder="Preço R$" style="flex:1"><input type="text" id="prod-link" placeholder="Link afiliado https://" style="flex:2"></div>
<button id="btnAddProd" style="background:#25d366;color:#fff;padding:10px;border-radius:8px;border:none;width:100%;margin-top:6px">+ Adicionar produto</button>
<p id="status-prod" style="font-size:11px"></p>
<div id="lista-meus-prods" style="max-height:40vh;overflow-y:auto;margin-top:10px"></div>
</div></div>

<!-- LOJA PUBLICA DISCRETA -->
<div id="loja-publica" class="hidden" style="position:absolute;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column">
<div class="header"><div class="header-left"><button class="icon-btn" id="btnFecharLoja">‹</button><div id="lp-avatar" class="avatar">?</div><div><div id="lp-nome" style="font-weight:bold">Loja</div><div id="lp-bio" style="font-size:11px;opacity:.8"></div></div></div></div>
<div id="lp-lista" style="flex:1;overflow-y:auto;padding:8px"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, getDocs, addDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzi_rystX7ymNbkeifTiO-YOxx2A9UCjI",
  authDomain: "zapleve.firebaseapp.com",
  projectId: "zapleve",
  storageBucket: "zapleve.firebasestorage.app",
  messagingSenderId: "426242600158",
  appId: "1:426242600158:web:09b519b9aa014667fc264f"
};
const app = initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app); const storage=getStorage(app);
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const slug=t=>String(t).toLowerCase().trim().replace(/[^a-z0-9]+/g,'').slice(0,20);
let currentData=null; let modoCadastro=false; let chatCom=null; let gravando=false; let mediaRecorder=null;

function getRef(){ const u=new URL(location.href); return u.searchParams.get('ref')||''; }
const refUrl=getRef(); if(refUrl){ localStorage.setItem('zapleve_ref', slug(refUrl)); $('aviso-convite').classList.remove('hidden'); $('aviso-convite').textContent=`🎉 Convite de @${slug(refUrl)}`; }

$('link-toggle').addEventListener('click', ()=>{
  modoCadastro=!modoCadastro; $('box-cadastro').classList.toggle('hidden', !modoCadastro);
  $('link-toggle').textContent = modoCadastro ? 'Já tem conta? Entrar só com email e senha' : 'Não tem conta? Criar com nome de usuário';
});
$('username-cadastro').addEventListener('input', ()=>{ const s=slug($('username-cadastro').value)||'seunome'; $('preview-link').textContent=`Seu link: ?ref=${s}`; });

async function entrar(){
  const e=$('email').value.trim(), p=$('password').value.trim(), st=$('status-login');
  if(!e||!p){ st.textContent='Email e senha'; return; }
  st.textContent='Entrando...'; try{ await signInWithEmailAndPassword(auth,e,p); st.textContent=''; }catch(err){ st.textContent='Erro: '+(err.code==='auth/invalid-credential'?'Email/senha errados':err.message); }
}
async function cadastrar(){
  const e=$('email').value.trim(), p=$('password').value.trim(), uRaw=$('username-cadastro').value.trim(), st=$('status-login');
  const username=slug(uRaw)||slug(e.split('@')[0]); if(!e||!p||!username){ st.textContent='Preencha email, senha e usuário'; return; }
  if(p.length<6){ st.textContent='Senha 6+ caracteres'; return; }
  st.textContent='Criando...'; try{
    const q=query(collection(db,"usuarios"), where("username","==",username)); const s=await getDocs(q); if(!s.empty){ st.textContent='@'+username+' já existe'; return; }
    const cred=await createUserWithEmailAndPassword(auth,e,p);
    const refP=localStorage.getItem('zapleve_ref')||null;
    const dados={ email:e, username, nome:username, displayName:username, bio:'', photoURL:'', referralCode:username, indicadoPor:refP, criadoEm:Date.now() };
    await setDoc(doc(db,"usuarios",cred.user.uid), dados); await setDoc(doc(db,"users",cred.user.uid), dados, {merge:true});
    localStorage.removeItem('zapleve_ref'); st.textContent='✅ Criado @'+username;
  }catch(err){ st.textContent='Erro: '+err.message; }
}
$('btnEntrar').addEventListener('click', entrar);
$('btnCadastrar').addEventListener('click', ()=>{ if(!modoCadastro){ modoCadastro=true; $('box-cadastro').classList.remove('hidden'); $('link-toggle').textContent='Já tem conta? Entrar só com email e senha'; return; } cadastrar(); });
$('btnTema').addEventListener('click', ()=>{ document.body.classList.toggle('dark-mode'); localStorage.setItem('zapleve_dark', document.body.classList.contains('dark-mode')?'1':'0'); });
if(localStorage.getItem('zapleve_dark')==='1') document.body.classList.add('dark-mode');

// PERFIL
$('areaMeuPerfil').addEventListener('click', ()=>{
  if(!currentData) return;
  $('input-nome-perfil').value=currentData.displayName||''; $('input-user-perfil').value=currentData.username||''; $('input-bio-perfil').value=currentData.bio||'';
  const av=$('perfil-foto-grande'); av.innerHTML=''; if(currentData.photoURL){ const im=document.createElement('img'); im.src=currentData.photoURL; av.appendChild(im); } else av.textContent=(currentData.username||'?')[0].toUpperCase();
  $('modal-perfil').style.display='flex';
});
$('btnFecharPerfil').addEventListener('click', ()=>$('modal-perfil').style.display='none');
$('input-foto').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ const av=$('perfil-foto-grande'); av.innerHTML=''; const im=document.createElement('img'); im.src=ev.target.result; av.appendChild(im); }; r.readAsDataURL(f);
});
$('btnSalvarPerfil').addEventListener('click', async()=>{
  const st=$('status-perfil'); const user=auth.currentUser; if(!user) return;
  const nome=$('input-nome-perfil').value.trim(); const username=slug($('input-user-perfil').value.trim()); const bio=$('input-bio-perfil').value.trim().slice(0,140);
  if(!username){ st.textContent='Usuário obrigatório'; return; }
  st.textContent='Salvando...'; try{
    if(username!==currentData.username){ const q=query(collection(db,"usuarios"), where("username","==",username)); const s=await getDocs(q); if(!s.empty){ st.textContent='@'+username+' já existe'; return; } }
    let photoURL=currentData.photoURL||''; const file=$('input-foto').files[0];
    if(file){ const rf=ref(storage, `perfil/${user.uid}/avatar_${Date.now()}.jpg`); await uploadBytes(rf,file); photoURL=await getDownloadURL(rf); }
    const upd={ displayName:nome||username, nome:nome||username, username, bio, photoURL };
    await updateDoc(doc(db,"usuarios",user.uid), upd); await setDoc(doc(db,"users",user.uid), upd, {merge:true});
    currentData={...currentData,...upd}; st.textContent='✅ Salvo!'; setTimeout(()=>{ $('modal-perfil').style.display='none'; atualizarTopo(); },700);
  }catch(e){ st.textContent='Erro: '+e.message; }
});
function atualizarTopo(){
  if(!currentData) return;
  $('meu-nome').textContent=currentData.displayName||currentData.username; $('meu-bio-topo').textContent=currentData.bio||'toque para editar perfil';
  const av=$('meu-avatar'); av.innerHTML=''; if(currentData.photoURL){ const im=document.createElement('img'); im.src=currentData.photoURL; av.appendChild(im); } else av.textContent=currentData.username[0].toUpperCase();
  const link=`${location.origin}${location.pathname.replace(/index\.html$/,'')}?ref=${currentData.username}`; $('input-link').value=link;
}

// CONTATOS
async function carregarContatos(){
  const lista=$('lista-contatos'); lista.innerHTML='Carregando...';
  const q=query(collection(db,"usuarios"), orderBy("criadoEm","desc")); const snap=await getDocs(q);
  lista.innerHTML='';
  snap.forEach(docSnap=>{
    const u=docSnap.data(); if(u.username===currentData?.username) return;
    const div=document.createElement('div'); div.className='contact-item';
    const avHtml = u.photoURL ? `<div class="avatar"><img src="${esc(u.photoURL)}"></div>` : `<div class="avatar">${esc((u.username||'?')[0].toUpperCase())}</div>`;
    div.innerHTML=`${avHtml}<div class="contact-info"><b>@${esc(u.username)} - ${esc(u.displayName||u.nome||'')}</b><span>${esc(u.bio||'sem recado')}</span></div><div style="font-size:10px;opacity:.5">🛒</div>`;
    div.addEventListener('click', ()=>abrirChat(u));
    const btnLoja=div.querySelector('div:last-child'); btnLoja.addEventListener('click', e=>{ e.stopPropagation(); abrirLoja(u.username); });
    lista.appendChild(div);
  });
  if(!lista.children.length) lista.innerHTML='<p style="text-align:center;opacity:.5;padding:20px;font-size:13px">Nenhum contato ainda<br>Compartilhe seu link ?ref=...</p>';
}
$('btnCopiarLink').addEventListener('click', async()=>{ const l=$('input-link').value; try{ await navigator.clipboard.writeText(l); alert('Copiado: '+l); }catch{ prompt('Copie:', l); } });
$('btnShare').addEventListener('click', async()=>{ const l=$('input-link').value; const t=`Entra no meu Zap Leve: ${l}`; if(navigator.share){ try{ await navigator.share({title:'Zap Leve', text:t, url:l}); }catch(_){} } else prompt('Copie:', l); });

// CHAT
function abrirChat(u){
  chatCom=u; $('contacts-screen').classList.add('hidden'); $('chat-screen').classList.remove('hidden');
  $('chat-nome').textContent='@'+u.username; $('chat-status').textContent=u.bio||'toque para ver catálogo';
  const av=$('chat-avatar'); av.innerHTML=''; if(u.photoURL){ const im=document.createElement('img'); im.src=u.photoURL; av.appendChild(im); } else av.textContent=u.username[0].toUpperCase();
  $('mensagens').innerHTML=`<div style="text-align:center;font-size:11px;opacity:.5;padding:10px">Início da conversa com @${esc(u.username)}<br>Link de indicação: ?ref=${esc(currentData.username)}</div>`;
}
$('btnVoltar').addEventListener('click', ()=>{ $('chat-screen').classList.add('hidden'); $('contacts-screen').classList.remove('hidden'); });

// CHAMADAS - DISCRETO IGUAL ANTIGO
$('btnCallAudio').addEventListener('click', ()=>{ if(!chatCom) return; alert(`📞 Chamando @${chatCom.username} por áudio... (P2P WebRTC em breve)`); addMsgSistema(`📞 Chamada de áudio para @${chatCom.username} iniciada`); });
$('btnCallVideo').addEventListener('click', ()=>{ if(!chatCom) return; alert(`📹 Chamando @${chatCom.username} por vídeo... (P2P WebRTC em breve)`); addMsgSistema(`📹 Chamada de vídeo para @${chatCom.username} iniciada`); });
function addMsgSistema(txt){ const box=$('mensagens'); const d=document.createElement('div'); d.style.cssText='text-align:center;font-size:11px;background:#e1f3fb;color:#01579b;padding:4px 8px;border-radius:12px;margin:8px auto;max-width:80%'; d.textContent=txt; box.appendChild(d); box.scrollTop=box.scrollHeight; }

// MENSAGENS - IMAGEM, VIDEO, AUDIO, TEXTO
function addMsg(html, minha=true){
  const box=$('mensagens'); const div=document.createElement('div'); div.className='msg '+(minha?'msg-eu':'msg-outro'); div.innerHTML=html+`<span class="hora">${new Date().toLocaleTimeString().slice(0,5)}</span>`; box.appendChild(div); box.scrollTop=box.scrollHeight;
}
function enviarTexto(){
  const campo=$('campo-msg'); const txt=campo.innerText.trim(); if(!txt) return;
  addMsg(esc(txt), true); campo.innerText=''; campo.focus();
}
$('btnEnviar').addEventListener('click', enviarTexto);
$('campo-msg').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviarTexto(); } });

// IMAGEM
$('btnAttachImg').addEventListener('click', ()=>$('fileImg').click());
$('fileImg').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const url=URL.createObjectURL(f);
  addMsg(`<img src="${url}" onclick="window.open(this.src)">`, true);
  e.target.value='';
});
// VIDEO
$('btnAttachVideo').addEventListener('click', ()=>$('fileVideo').click());
$('fileVideo').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const url=URL.createObjectURL(f);
  addMsg(`<video src="${url}" controls></video>`, true);
  e.target.value='';
});
// AUDIO - GRAVAÇÃO SIMPLES
$('btnAudio').addEventListener('click', async()=>{
  if(gravando){
    mediaRecorder.stop(); return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream); const chunks=[];
    mediaRecorder.ondataavailable=e=>chunks.push(e.data);
    mediaRecorder.onstop=()=>{
      const blob=new Blob(chunks,{type:'audio/webm'}); const url=URL.createObjectURL(blob);
      addMsg(`<audio controls src="${url}"></audio><br><span style="font-size:11px">🎤 Áudio</span>`, true);
      stream.getTracks().forEach(t=>t.stop()); gravando=false; $('btnAudio').textContent='🎤'; $('btnAudio').style.color='';
    };
    mediaRecorder.start(); gravando=true; $('btnAudio').textContent='⏹️'; $('btnAudio').style.color='red';
    setTimeout(()=>{ if(gravando) mediaRecorder.stop(); }, 30000);
  }catch(err){ alert('Microfone não permitido: '+err.message); }
});

// CATÁLOGO DISCRETO
$('btnAbrirCatalogo').addEventListener('click', ()=>{ $('modal-catalogo').style.display='flex'; carregarMeusProds(); });
$('btnFecharCatalogo').addEventListener('click', ()=>$('modal-catalogo').style.display='none');
$('btnAddProd').addEventListener('click', async()=>{
  const st=$('status-prod'); const user=auth.currentUser; if(!user) return;
  const nome=$('prod-nome').value.trim(), preco=$('prod-preco').value.trim(), link=$('prod-link').value.trim(), file=$('prod-foto').files[0];
  if(!nome||!preco){ st.textContent='Nome e preço'; return; }
  st.textContent='Salvando...'; try{
    let foto=''; if(file){ const r=ref(storage, `produtos/${user.uid}/${Date.now()}_${file.name}`); await uploadBytes(r,file); foto=await getDownloadURL(r); }
    await addDoc(collection(db,"produtos"), {ownerId:user.uid, username:currentData.username, nome, preco, afiliadoLink:link, fotoUrl:foto, criadoEm:Date.now()});
    st.textContent='✅ Produto salvo'; $('prod-nome').value=''; $('prod-preco').value=''; $('prod-link').value=''; $('prod-foto').value=''; carregarMeusProds();
  }catch(e){ st.textContent='Erro: '+e.message; }
});
async function carregarMeusProds(){
  const lista=$('lista-meus-prods'); const user=auth.currentUser; if(!user) return; lista.innerHTML='Carregando...';
  const q=query(collection(db,"produtos"), where("ownerId","==",user.uid), orderBy("criadoEm","desc")); const snap=await getDocs(q);
  lista.innerHTML=''; if(snap.empty){ lista.innerHTML='<p style="font-size:12px;opacity:.5">Nenhum produto</p>'; return; }
  snap.forEach(d=>{
    const p=d.data(); const id=d.id; const div=document.createElement('div'); div.className='prod-mini';
    div.innerHTML=`<img src="${esc(p.fotoUrl||'https://via.placeholder.com/48')}"><div style="flex:1"><b style="font-size:13px">${esc(p.nome)}</b><br><span style="color:#25d366;font-weight:bold;font-size:12px">${esc(p.preco)}</span><br><span style="font-size:10px">${p.afiliadoLink?`🔗 afiliado`:'sem link'}</span></div><button style="width:auto;background:#ea0038;padding:6px 8px;font-size:11px" data-del="${id}">Excluir</button>`;
    lista.appendChild(div);
  });
  lista.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async e=>{ const id=e.target.getAttribute('data-del'); if(confirm('Excluir?')){ await deleteDoc(doc(db,"produtos",id)); carregarMeusProds(); } }));
}

// LOJA PUBLICA
async function abrirLoja(username){
  $('loja-publica').classList.remove('hidden'); $('lp-nome').textContent='@'+username; $('lp-bio').textContent='Carregando catálogo...'; const lista=$('lp-lista'); lista.innerHTML='Carregando...';
  const qUser=query(collection(db,"usuarios"), where("username","==",username)); const sUser=await getDocs(qUser);
  if(!sUser.empty){ const u=sUser.docs[0].data(); $('lp-nome').textContent='@'+u.username+' - '+(u.displayName||''); $('lp-bio').textContent=u.bio||''; const av=$('lp-avatar'); av.innerHTML=''; if(u.photoURL){ const im=document.createElement('img'); im.src=u.photoURL; av.appendChild(im); } else av.textContent=u.username[0].toUpperCase(); }
  const q=query(collection(db,"produtos"), where("username","==",username), orderBy("criadoEm","desc")); const snap=await getDocs(q);
  lista.innerHTML=''; if(snap.empty){ lista.innerHTML='<p style="text-align:center;opacity:.5;padding:20px">Nenhum produto</p>'; return; }
  snap.forEach(d=>{
    const p=d.data(); const div=document.createElement('div'); div.className='prod-mini'; div.style.background='var(--bg)'; div.style.border='1px solid var(--border)'; div.style.borderRadius='8px'; div.style.marginBottom='8px';
    div.innerHTML=`<img src="${esc(p.fotoUrl||'https://via.placeholder.com/48')}" style="width:60px;height:60px"><div style="flex:1"><b>${esc(p.nome)}</b><br><span style="color:#25d366;font-weight:bold">${esc(p.preco)}</span><br>${p.afiliadoLink?`<a href="${esc(p.afiliadoLink)}" target="_blank"><button style="padding:6px 10px;font-size:11px;background:#ff6a00;width:auto">🛒 Comprar</button></a>`:''}</div>`;
    lista.appendChild(div);
  });
}
$('btnFecharLoja').addEventListener('click', ()=>$('loja-publica').classList.add('hidden'));

$('btnSair').addEventListener('click', async()=>{ await signOut(auth); location.reload(); });

onAuthStateChanged(auth, async(user)=>{
  if(user){
    $('auth-screen').classList.add('hidden'); $('contacts-screen').classList.remove('hidden');
    const snap=await getDoc(doc(db,"usuarios",user.uid)); if(snap.exists()){ currentData=snap.data(); atualizarTopo(); carregarContatos(); }
  }else{
    $('auth-screen').classList.remove('hidden'); $('contacts-screen').classList.add('hidden'); $('chat-screen').classList.add('hidden'); currentData=null;
  }
});

<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zap Leve - Chat & Chamadas P2P Grátis</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00a884"><link rel="icon" type="image/png" href="icon-192.png">
<style>
:root { --bg-app:#ffffff; --text-app:#111111; --header-bg:#00a884; --chat-bg:#efeae2; --input-bg:#f0f2f5; --msg-minha:#d9fdd3; --msg-outra:#ffffff; --border-color:#d1d7db; }
body.dark-mode { --bg-app:#111b21; --text-app:#e9edef; --header-bg:#202c33; --chat-bg:#0b141a; --input-bg:#202c33; --msg-minha:#005c4b; --msg-outra:#202c33; --border-color:#222d34; }
*{box-sizing:border-box} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg-app);color:var(--text-app);margin:0;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;overflow:hidden}
.container{width:100%;height:100%;background:var(--bg-app);display:flex;flex-direction:column;position:relative}
.hidden{display:none!important}
.screen-content{flex:1;display:flex;flex-direction:column;padding:12px;overflow:hidden;background:var(--bg-app);width:100%;height:100%}
.logo-area{text-align:center;margin:15px 0} .logo-area h1{font-size:26px;color:var(--header-bg);margin:5px 0 0 0}
.botao-flutuante-loja{position:fixed;bottom:20px;right:18px;background:#27ae60;color:#fff;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.35);z-index:999;text-decoration:none;cursor:pointer;border:2px solid #fff}
input,textarea,button{width:100%;padding:12px;margin:6px 0;border:1px solid var(--border-color);border-radius:6px;font-size:15px;outline:none;background:var(--input-bg);color:var(--text-app)}
button{background:#00a884;color:#fff;border:none;cursor:pointer;font-weight:bold}
.btn-alt{background:#075e54} .btn-danger{background:#ea0038}
.contact-list{flex:1;overflow-y:auto;background:var(--bg-app)} .contact-item{padding:12px 10px;border-bottom:1px solid var(--border-color);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#075e54;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;flex-shrink:0;overflow:hidden} .avatar img{width:100%;height:100%;object-fit:cover}
.chat-box{flex:1;overflow-y:auto;padding:12px;background:var(--chat-bg);display:flex;flex-direction:column;gap:6px}
.msg{padding:8px 12px;border-radius:7.5px;background:var(--msg-outra);max-width:88%;box-shadow:0 1px .5px rgba(0,0,0,.13)} .msg-minha{background:var(--msg-minha);margin-left:auto}
.header-top{display:flex;justify-content:space-between;align-items:center;background:var(--header-bg);color:#fff;padding:10px 14px;width:100%;flex-shrink:0}
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.55);justify-content:center;align-items:center;padding:20px}
.modal-content{background:var(--bg-app);color:var(--text-app);padding:20px;border-radius:8px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;border:1px solid var(--border-color)}
.prod-card{border:1px solid var(--border-color);border-radius:8px;overflow:hidden;background:var(--bg-app);margin-bottom:8px;display:flex;gap:8px;padding:8px;align-items:center}
.prod-card img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#eee}
</style>
</head>
<body>
<div class="container">
<a class="botao-flutuante-loja" id="btnVitrine">🛒</a>

<!-- LOJA PUBLICA - MESMO LAYOUT ORIGINAL -->
<div id="loja-publica" class="hidden" style="position:fixed;inset:0;z-index:1500;background:var(--bg-app);overflow-y:auto;">
<div style="background:var(--header-bg);color:#fff;padding:14px;display:flex;align-items:center;gap:10px;">
<div id="lp-inicial" class="avatar">?</div><div><div id="lp-nome" style="font-weight:bold">Loja</div><div id="lp-bio" style="font-size:11px;opacity:.9"></div></div><button id="btnFecharLoja" style="width:auto;margin-left:auto;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:4px">X</button>
</div><div id="lp-lista" style="padding:12px"></div></div>

<!-- AUTH - MESMO LAYOUT DA SUA FOTO, MAS COM NOME DE USUÁRIO -->
<div id="auth-screen" class="screen-content" style="justify-content:center;max-width:380px;margin:0 auto;">
<div class="logo-area"><span style="font-size:45px">⚡💬</span><h1>Zap Leve</h1><p style="font-size:13px;opacity:.7;margin:4px 0">Chat P2P e utilitários integrados</p></div>
<p id="aviso-convite" class="hidden" style="background:#e8f5e9;color:#1b5e20;padding:10px;border-radius:6px;font-size:12px;text-align:center;border:1px solid #a5d6a7"></p>
<input type="email" id="email" placeholder="Seu e-mail">
<input type="password" id="password" placeholder="Sua senha (6+ caracteres)">
<input type="text" id="username-cadastro" placeholder="Seu nome de usuário (ex: rafa60) - só para criar conta" style="text-transform:lowercase">
<p id="preview-link" style="font-size:10px;opacity:.6;text-align:center;word-break:break-all"></p>
<div style="display:flex;gap:8px"><button style="flex:1;background:#0275d8" id="btnEntrar">Entrar</button><button style="flex:1;background:#28a745" id="btnCadastrar">Abrir Conta</button></div>
<button class="btn-alt" style="background:#333;margin-top:10px" id="btnTema">🌓 Alternar Tema Claro / Escuro</button>
<p id="status-login" style="font-size:12px;text-align:center;margin-top:8px;min-height:18px"></p>
<p style="font-size:10px;opacity:.5;text-align:center">Layout original + catálogo + link + bio + foto</p>
</div>

<!-- CONTATOS - MESMO LAYOUT ORIGINAL -->
<div id="contacts-screen" class="hidden screen-content" style="padding:0">
<div class="header-top"><div id="areaMeuPerfil" style="display:flex;align-items:center;gap:10px;cursor:pointer"><div id="meu-avatar-topo" class="avatar">?</div><div><h3 style="margin:0;font-size:15px;color:#fff">Zap Leve ⚡</h3><span id="user-display-contacts" style="font-size:11px;color:#e0f2f1"></span><span id="meu-link-indicacao" style="font-size:10px;color:#a5d6a7;display:block"></span></div></div><button style="width:auto;background:#ea0038;padding:6px 10px;font-size:12px" id="btnSair">Sair</button></div>
<div style="padding:12px;flex:1;display:flex;flex-direction:column;overflow:hidden">
<div class="contact-list" id="lista-contatos"></div>
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn-alt" style="background:#005c4b;border-radius:20px;flex:1" id="btnConvidar">📤 Convidar Amigo</button><button class="btn-alt" style="background:#333;border-radius:20px;flex:1" id="btnCopiarLink">🔗 Copiar link</button></div>
<input type="text" id="input-link-compartilhar" readonly style="font-size:11px;text-align:center;margin-top:6px">
</div>
</div>

<!-- CHAT - MESMO LAYOUT ORIGINAL COM CHAMADA -->
<div id="chat-screen" class="hidden screen-content" style="padding:0">
<div class="header-top"><div style="display:flex;align-items:center;gap:8px"><span id="btnVoltar" style="color:#fff;text-decoration:underline;cursor:pointer;font-weight:bold">voltar</span><div id="chat-avatar-topo" class="avatar">?</div><h3 id="chat-nome-topo" style="margin:0;color:#fff;font-size:14px">Chat</h3></div><div style="display:flex;gap:4px"><button style="width:auto;padding:6px 8px;font-size:14px;background:rgba(0,0,0,.2)" id="btnCallAudio">📞</button><button style="width:auto;padding:6px 8px;font-size:14px;background:rgba(0,0,0,.2)" id="btnCallVideo">📹</button><button style="width:auto;background:#ea0038;padding:6px 10px;font-size:12px" id="btnSairChat">Sair</button></div></div>
<div class="chat-box" id="mensagens"></div>
<div style="display:flex;gap:6px;padding:8px;background:var(--input-bg);border-top:1px solid var(--border-color);align-items:center">
<button style="width:auto;background:transparent;color:var(--text-app);font-size:20px" id="btnAttachImg">📎</button>
<input type="text" id="mensagem-texto" placeholder="Mensagem..." style="margin:0;border-radius:20px;flex:1">
<button style="width:auto;background:transparent;color:var(--text-app);font-size:20px" id="btnAudio">🎤</button>
<button id="btnEnviar" style="width:auto;padding:10px 18px;border-radius:20px">Enviar</button>
</div>
<input type="file" id="fileImgChat" accept="image/*,video/*" class="hidden">
</div>

<!-- MODAL PERFIL - BIO + FOTO - MESMO ESTILO ORIGINAL -->
<div id="modal-perfil-usuario" class="modal"><div class="modal-content" style="text-align:center">
<h3 style="color:var(--header-bg)">Meu Perfil - igual WhatsApp</h3>
<div id="perfil-foto-preview" class="avatar" style="width:80px;height:80px;margin:0 auto 10px;font-size:28px">?</div>
<input type="file" id="input-foto-perfil" accept="image/*">
<input type="text" id="input-perfil-nome" placeholder="Seu nome (ex: Rafa)">
<input type="text" id="input-perfil-username" placeholder="Nome de usuário @ (ex: rafa60)" style="text-transform:lowercase">
<textarea id="input-perfil-bio" placeholder="Bio / Recado (ex: Vendo produtos, me chama!)" style="min-height:60px;resize:none"></textarea>
<p id="status-perfil" style="font-size:11px;min-height:14px"></p>
<button style="background:#28a745" id="btnSalvarPerfil">💾 Salvar Perfil</button>
<button style="background:#888;margin-top:6px" id="btnFecharPerfil">Fechar</button>
</div></div>

<!-- MODAL CATALOGO - MESMO ESTILO ORIGINAL -->
<div id="modal-catalogo" class="modal"><div class="modal-content">
<h3 style="color:var(--header-bg);margin-top:0">Meu Catálogo</h3>
<p style="font-size:11px;opacity:.6">Cada produto tem foto, nome, preço e botão que abre seu link de afiliado.</p>
<input type="file" id="input-prod-foto" accept="image/*">
<input type="text" id="input-prod-nome" placeholder="Nome do produto (ex: Fone Bluetooth)">
<input type="text" id="input-prod-preco" placeholder="Preço (ex: R$ 99,90)">
<input type="text" id="input-prod-afiliado" placeholder="Link de afiliado https://...">
<p id="status-prod" style="font-size:11px"></p>
<button style="background:#28a745" id="btnSalvarProduto">+ Salvar Produto</button>
<div id="lista-meus-produtos" style="margin-top:12px;max-height:40vh;overflow-y:auto"></div>
<button style="background:#888;margin-top:10px" id="btnFecharCatalogo">Fechar</button>
</div></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, getDocs, addDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzi_rystX7ymNbkeifTiO-YOxx2A9UCjI",
  authDomain: "zapleve.firebaseapp.com",
  projectId: "zapleve",
  storageBucket: "zapleve.firebasestorage.app",
  messagingSenderId: "426242600158",
  appId: "1:426242600158:web:09b519b9aa014667fc264f"
};
const app = initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app); const storage=getStorage(app);
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const slug=t=>String(t).toLowerCase().trim().replace(/[^a-z0-9]+/g,'').slice(0,20);
let currentData=null; let chatCom=null;

function getRefUrl(){ const u=new URL(location.href); return u.searchParams.get('ref')||''; }
const refUrl=getRefUrl(); if(refUrl){ localStorage.setItem('zapleve_ref', slug(refUrl)); $('aviso-convite').classList.remove('hidden'); $('aviso-convite').innerHTML=`🎉 Você foi convidado por <b>@${esc(slug(refUrl))}</b>! Crie sua conta.`; }

$('username-cadastro').addEventListener('input', ()=>{ const s=slug($('username-cadastro').value)||slug($('email').value.split('@')[0])||'seunome'; $('preview-link').textContent=`Seu link vai ficar: ${location.origin}/?ref=${s}`; });
$('email').addEventListener('input', ()=>{ if(!$('username-cadastro').value){ const s=slug($('email').value.split('@')[0]); if(s) $('preview-link').textContent=`Sugestão: ?ref=${s}`; } });

async function entrar(){
  const email=$('email').value.trim(), senha=$('password').value.trim(), st=$('status-login');
  if(!email||!senha){ st.style.color='red'; st.textContent='Preencha e-mail e senha'; return; }
  st.style.color='#00a884'; st.textContent='Entrando...';
  try{ await signInWithEmailAndPassword(auth,email,senha); st.textContent=''; }
  catch(e){ st.style.color='red'; let m=e.message; if(e.code==='auth/invalid-credential') m='E-mail ou senha incorretos'; if(e.code==='auth/user-not-found') m='Não existe, clique em Abrir Conta'; st.textContent='Erro: '+m; }
}
async function cadastrar(){
  const email=$('email').value.trim(), senha=$('password').value.trim(), uRaw=$('username-cadastro').value.trim(), st=$('status-login');
  const username=slug(uRaw)||slug(email.split('@')[0]);
  if(!email||!senha||!username){ st.style.color='red'; st.textContent='Preencha e-mail, senha e nome de usuário'; return; }
  if(senha.length<6){ st.style.color='red'; st.textContent='Senha 6+'; return; }
  st.style.color='#00a884'; st.textContent='Criando...';
  try{
    const q=query(collection(db,"usuarios"), where("username","==",username)); const s=await getDocs(q); if(!s.empty){ st.style.color='red'; st.textContent='@'+username+' já existe'; return; }
    const cred=await createUserWithEmailAndPassword(auth,email,senha);
    const refP=localStorage.getItem('zapleve_ref')||null;
    const dados={ email, username, nome:username, displayName:username, bio:'', photoURL:'', referralCode:username, indicadoPor:refP, criadoEm:Date.now(), limiteProdutos:50 };
    await setDoc(doc(db,"usuarios",cred.user.uid), dados); await setDoc(doc(db,"users",cred.user.uid), dados, {merge:true});
    localStorage.removeItem('zapleve_ref'); st.style.color='#00a884'; st.textContent='✅ Conta @'+username+' criada!';
  }catch(e){ st.style.color='red'; st.textContent='Erro: '+e.message; }
}
window.entrar=entrar; window.cadastrar=cadastrar;
$('btnEntrar').addEventListener('click', entrar);
$('btnCadastrar').addEventListener('click', cadastrar);
$('btnTema').addEventListener('click', ()=>{ document.body.classList.toggle('dark-mode'); localStorage.setItem('zapleve_dark', document.body.classList.contains('dark-mode')?'1':'0'); });
if(localStorage.getItem('zapleve_dark')==='1') document.body.classList.add('dark-mode');

// PERFIL COM FOTO E BIO
$('areaMeuPerfil').addEventListener('click', ()=>{
  if(!currentData) return;
  $('input-perfil-nome').value=currentData.displayName||''; $('input-perfil-username').value=currentData.username||''; $('input-perfil-bio').value=currentData.bio||'';
  const av=$('perfil-foto-preview'); av.innerHTML=''; if(currentData.photoURL){ const im=document.createElement('img'); im.src=currentData.photoURL; av.appendChild(im); } else av.textContent=currentData.username[0].toUpperCase();
  $('modal-perfil-usuario').style.display='flex';
});
$('btnFecharPerfil').addEventListener('click', ()=>$('modal-perfil-usuario').style.display='none');
$('input-foto-perfil').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ const av=$('perfil-foto-preview'); av.innerHTML=''; const im=document.createElement('img'); im.src=ev.target.result; av.appendChild(im); }; r.readAsDataURL(f);
});
$('btnSalvarPerfil').addEventListener('click', async()=>{
  const st=$('status-perfil'); const user=auth.currentUser; if(!user) return;
  const nome=$('input-perfil-nome').value.trim(); const username=slug($('input-perfil-username').value.trim()); const bio=$('input-perfil-bio').value.trim().slice(0,140);
  if(!username){ st.style.color='red'; st.textContent='Usuário obrigatório'; return; }
  st.style.color='#00a884'; st.textContent='Salvando...';
  try{
    if(username!==currentData.username){ const q=query(collection(db,"usuarios"), where("username","==",username)); const s=await getDocs(q); if(!s.empty){ st.style.color='red'; st.textContent='@'+username+' já existe'; return; } }
    let photoURL=currentData.photoURL||''; const file=$('input-foto-perfil').files[0];
    if(file){ const rf=ref(storage, `perfil/${user.uid}/avatar_${Date.now()}.jpg`); await uploadBytes(rf,file); photoURL=await getDownloadURL(rf); }
    const upd={ displayName:nome||username, nome:nome||username, username, bio, photoURL };
    await updateDoc(doc(db,"usuarios",user.uid), upd); await setDoc(doc(db,"users",user.uid), upd, {merge:true});
    currentData={...currentData,...upd}; st.style.color='green'; st.textContent='✅ Perfil salvo!'; setTimeout(()=>{ $('modal-perfil-usuario').style.display='none'; atualizarTela(); },700);
  }catch(e){ st.style.color='red'; st.textContent='Erro: '+e.message; }
});

function atualizarTela(){
  if(!currentData) return;
  const meuLink=`${location.origin}${location.pathname.replace(/index\.html$/,'')}?ref=${currentData.username}`;
  $('user-display-contacts').textContent='@'+currentData.username+' | '+(currentData.bio||'sem bio');
  $('meu-link-indicacao').textContent='Seu link: ?ref='+currentData.username;
  $('input-link-compartilhar').value=meuLink;
  const av=$('meu-avatar-topo'); av.innerHTML=''; if(currentData.photoURL){ const im=document.createElement('img'); im.src=currentData.photoURL; av.appendChild(im); } else av.textContent=currentData.username[0].toUpperCase();
  carregarContatos();
}
async function carregarContatos(){
  const lista=$('lista-contatos'); lista.innerHTML='Carregando...';
  const q=query(collection(db,"usuarios"), orderBy("criadoEm","desc")); const snap=await getDocs(q);
  lista.innerHTML=''; snap.forEach(d=>{
    const u=d.data(); if(u.username===currentData.username) return;
    const div=document.createElement('div'); div.className='contact-item';
    const avHtml = u.photoURL ? `<div class="avatar"><img src="${esc(u.photoURL)}"></div>` : `<div class="avatar">${esc((u.username||'?')[0].toUpperCase())}</div>`;
    div.innerHTML=`<div style="display:flex;gap:10px;align-items:center">${avHtml}<div><b style="font-size:14px">@${esc(u.username)} - ${esc(u.displayName||'')}</b><br><span style="font-size:11px;opacity:.6">${esc(u.bio||'sem recado')}</span></div></div><span style="font-size:10px">🛒</span>`;
    div.addEventListener('click', ()=>{ chatCom=u; $('contacts-screen').classList.add('hidden'); $('chat-screen').classList.remove('hidden'); $('chat-nome-topo').textContent='@'+u.username; const av=$('chat-avatar-topo'); av.innerHTML=''; if(u.photoURL){ const im=document.createElement('img'); im.src=u.photoURL; av.appendChild(im); } else av.textContent=u.username[0].toUpperCase(); $('mensagens').innerHTML=`<div style="text-align:center;font-size:11px;opacity:.5;padding:10px">Conversa com @${esc(u.username)}<br>${esc(u.bio||'')}<br><br><button onclick="window.abrirLoja('${esc(u.username)}')" style="width:auto;padding:6px 12px;font-size:11px;background:#27ae60;border-radius:12px">🛒 Ver catálogo de @${esc(u.username)}</button></div>`; });
    lista.appendChild(div);
  });
  if(!lista.children.length) lista.innerHTML='<p style="text-align:center;opacity:.5;padding:20px;font-size:13px">Nenhum contato ainda<br>Compartilhe seu link ?ref='+esc(currentData.username)+'</p>';
}
$('btnConvidar').addEventListener('click', async()=>{ const l=$('input-link-compartilhar').value; const t=`Entra no meu Zap Leve: ${l}`; if(navigator.share){ try{ await navigator.share({title:'Zap Leve', text:t, url:l}); }catch(_){} } else prompt('Copie:', l); });
$('btnCopiarLink').addEventListener('click', async()=>{ const l=$('input-link-compartilhar').value; try{ await navigator.clipboard.writeText(l); alert('Copiado: '+l); }catch{ prompt('Copie:', l); } });
$('btnSair').addEventListener('click', async()=>{ await signOut(auth); location.reload(); });
$('btnVoltar').addEventListener('click', ()=>{ $('chat-screen').classList.add('hidden'); $('contacts-screen').classList.remove('hidden'); });
$('btnSairChat').addEventListener('click', ()=>{ $('chat-screen').classList.add('hidden'); $('contacts-screen').classList.remove('hidden'); });
$('btnEnviar').addEventListener('click', ()=>{ const txt=$('mensagem-texto').value.trim(); if(!txt) return; const box=$('mensagens'); const d=document.createElement('div'); d.className='msg msg-minha'; d.textContent=txt; box.appendChild(d); $('mensagem-texto').value=''; box.scrollTop=box.scrollHeight; });
$('mensagem-texto').addEventListener('keypress', e=>{ if(e.key==='Enter') $('btnEnviar').click(); });
$('btnAttachImg').addEventListener('click', ()=>$('fileImgChat').click());
$('fileImgChat').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const url=URL.createObjectURL(f); const box=$('mensagens');
  const isVideo=f.type.startsWith('video'); const div=document.createElement('div'); div.className='msg msg-minha';
  div.innerHTML = isVideo ? `<video src="${url}" controls style="max-width:100%;border-radius:6px"></video>` : `<img src="${url}" style="max-width:100%;border-radius:6px">`;
  box.appendChild(div); box.scrollTop=box.scrollHeight; e.target.value='';
});
$('btnCallAudio').addEventListener('click', ()=>{ if(!chatCom) return; alert('📞 Chamando @'+chatCom.username+' por áudio...'); });
$('btnCallVideo').addEventListener('click', ()=>{ if(!chatCom) return; alert('📹 Chamando @'+chatCom.username+' por vídeo...'); });
$('btnAudio').addEventListener('click', async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true}); const mr=new MediaRecorder(stream); const chunks=[];
    mr.ondataavailable=e=>chunks.push(e.data); mr.onstop=()=>{ const blob=new Blob(chunks,{type:'audio/webm'}); const url=URL.createObjectURL(blob); const box=$('mensagens'); const d=document.createElement('div'); d.className='msg msg-minha'; d.innerHTML=`<audio controls src="${url}"></audio>`; box.appendChild(d); box.scrollTop=box.scrollHeight; stream.getTracks().forEach(t=>t.stop()); };
    mr.start(); alert('🎤 Gravando... clique OK para parar (máx 30s)'); setTimeout(()=>{ if(mr.state==='recording') mr.stop(); }, 30000);
    // segundo clique para parar
    $('btnAudio').onclick = ()=>{ if(mr.state==='recording') mr.stop(); $('btnAudio').onclick=null; setTimeout(()=>{ $('btnAudio').addEventListener('click', arguments.callee); }, 500); };
  }catch(err){ alert('Microfone não permitido'); }
});

$('btnVitrine').addEventListener('click', ()=>{ $('modal-catalogo').style.display='flex'; carregarMeusProds(); });

$('btnSalvarProduto').addEventListener('click', async()=>{
  const st=$('status-prod'); const user=auth.currentUser; if(!user) return;
  const nome=$('input-prod-nome').value.trim(), preco=$('input-prod-preco').value.trim(), link=$('input-prod-afiliado').value.trim(), file=$('input-prod-foto').files[0];
  if(!nome||!preco){ st.style.color='red'; st.textContent='Nome e preço obrigatórios'; return; }
  st.style.color='#00a884'; st.textContent='Salvando...';
  try{
    let foto=''; if(file){ const r=ref(storage, `produtos/${user.uid}/${Date.now()}_${file.name}`); await uploadBytes(r,file); foto=await getDownloadURL(r); }
    await addDoc(collection(db,"produtos"), {ownerId:user.uid, username:currentData.username, nome, preco, afiliadoLink:link, fotoUrl:foto, criadoEm:Date.now()});
    st.style.color='green'; st.textContent='✅ Produto salvo!'; $('input-prod-nome').value=''; $('input-prod-preco').value=''; $('input-prod-afiliado').value=''; $('input-prod-foto').value=''; carregarMeusProds();
  }catch(e){ st.style.color='red'; st.textContent='Erro: '+e.message; }
});
async function carregarMeusProds(){
  const lista=$('lista-meus-produtos'); const user=auth.currentUser; if(!user) return; lista.innerHTML='Carregando...';
  const q=query(collection(db,"produtos"), where("ownerId","==",user.uid), orderBy("criadoEm","desc")); const snap=await getDocs(q);
  lista.innerHTML=''; if(snap.empty){ lista.innerHTML='<p style="font-size:12px;opacity:.5">Nenhum produto ainda</p>'; return; }
  snap.forEach(d=>{
    const p=d.data(); const id=d.id; const div=document.createElement('div'); div.className='prod-card';
    div.innerHTML=`<img src="${esc(p.fotoUrl||'https://via.placeholder.com/64')}"><div style="flex:1"><b style="font-size:13px">${esc(p.nome)}</b><br><span style="color:#27ae60;font-weight:bold;font-size:12px">${esc(p.preco)}</span><br>${p.afiliadoLink?`<a href="${esc(p.afiliadoLink)}" target="_blank" style="font-size:11px">🔗 Afiliado</a>`:''}</div><button style="width:auto;background:#ea0038;padding:6px 8px;font-size:11px" data-del="${id}">X</button>`;
    lista.appendChild(div);
  });
  lista.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async e=>{ const id=e.target.getAttribute('data-del'); if(confirm('Excluir?')){ await deleteDoc(doc(db,"produtos",id)); carregarMeusProds(); } }));
}
window.abrirLoja = async(username)=>{
  $('loja-publica').classList.remove('hidden'); $('lp-nome').textContent='@'+username; $('lp-bio').textContent='Carregando...'; const lista=$('lp-lista'); lista.innerHTML='Carregando...';
  const qUser=query(collection(db,"usuarios"), where("username","==",username)); const sUser=await getDocs(qUser);
  if(!sUser.empty){ const u=sUser.docs[0].data(); $('lp-nome').textContent='@'+u.username+' - '+(u.displayName||''); $('lp-bio').textContent=u.bio||''; const av=$('lp-inicial'); av.innerHTML=''; if(u.photoURL){ const im=document.createElement('img'); im.src=u.photoURL; av.appendChild(im); } else av.textContent=u.username[0].toUpperCase(); }
  const q=query(collection(db,"produtos"), where("username","==",username), orderBy("criadoEm","desc")); const snap=await getDocs(q);
  lista.innerHTML=''; if(snap.empty){ lista.innerHTML='<p style="text-align:center;opacity:.5;padding:20px">Nenhum produto no catálogo</p>'; return; }
  snap.forEach(d=>{
    const p=d.data(); const div=document.createElement('div'); div.className='prod-card';
    div.innerHTML=`<img src="${esc(p.fotoUrl||'https://via.placeholder.com/64')}" style="width:70px;height:70px"><div style="flex:1"><b>${esc(p.nome)}</b><br><span style="color:#27ae60;font-weight:bold">${esc(p.preco)}</span><br>${p.afiliadoLink?`<a href="${esc(p.afiliadoLink)}" target="_blank"><button style="padding:6px 12px;font-size:11px;background:#ff6a00;width:auto;border-radius:12px">🛒 Comprar / Afiliado</button></a>`:''}</div>`;
    lista.appendChild(div);
  });
};
$('btnFecharLoja').addEventListener('click', ()=>$('loja-publica').classList.add('hidden'));

onAuthStateChanged(auth, async(user)=>{
  if(user){
    $('auth-screen').classList.add('hidden'); $('contacts-screen').classList.remove('hidden');
    const snap=await getDoc(doc(db,"usuarios",user.uid)); if(snap.exists()){ currentData=snap.data(); atualizarTela(); }
  }else{
    $('auth-screen').classList.remove('hidden'); $('contacts-screen').classList.add('hidden'); $('chat-screen').classList.add('hidden'); currentData=null;
  }
});

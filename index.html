<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zap Leve - Chat Privado, Admin & Corretor Inteligente</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 420px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        h2, h3 { color: #075e54; text-align: center; margin-top: 0; }
        .logo-area { text-align: center; margin-bottom: 15px; }
        .logo-area span { font-size: 35px; }
        .logo-area h1 { font-size: 22px; color: #075e54; margin: 5px 0 0 0; }
        
        #banner-topo { background: #075e54; color: white; padding: 10px; border-radius: 6px; text-align: center; font-size: 13px; margin-bottom: 15px; font-weight: bold; display: none; }
        
        input, textarea, button, select { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #25d366; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #1ebe5d; }
        .btn-alt { background: #075e54; }
        .btn-alt:hover { background: #054c43; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        
        .contact-list { height: 240px; border: 1px solid #ddd; border-radius: 6px; overflow-y: scroll; padding: 5px; margin-bottom: 10px; background: #fff; }
        .contact-item { padding: 8px 10px; margin-bottom: 5px; border-bottom: 1px solid #eee; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; }
        .contact-item:hover { background: #e9edef; }
        .contact-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #075e54; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; font-weight: bold; flex-shrink: 0; }
        .contact-name { font-weight: bold; color: #333; font-size: 14px; }

        .chat-box { height: 220px; border: 1px solid #ddd; border-radius: 6px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #e5ddd5; }
        .msg { margin-bottom: 10px; padding: 8px; border-radius: 8px; background: #ffffff; position: relative; max-width: 85%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); display: flex; gap: 8px; align-items: flex-start; }
        .msg-minha { background: #dcf8c6; margin-left: auto; flex-direction: row-reverse; }
        .msg-content { flex: 1; }
        .msg-audio-btn { background: #25d366; border: none; color: white; padding: 3px 6px; font-size: 11px; border-radius: 4px; cursor: pointer; margin-top: 4px; display: inline-flex; align-items: center; gap: 3px; }
        .input-group { display: flex; gap: 6px; }
        .mic-btn { width: 50px; font-size: 16px; background: #ff9800; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .user-info-area { display: flex; align-items: center; gap: 8px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 6px; border-bottom: 1px solid #eee; font-size: 12px; }
        .file-upload-label { display: block; font-size: 12px; color: #444; text-align: left; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- BANNER DINÂMICO DO TOPO -->
    <div id="banner-topo"></div>

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="auth-screen">
        <div class="logo-area">
            <span>⚡💬</span>
            <h1>Zap Leve</h1>
            <p style="color: #666; font-size: 13px; margin: 5px 0 0 0;">Chat com Corretor Ortográfico Integrado</p>
        </div>
        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="password" placeholder="Sua senha">
        
        <label class="file-upload-label">Foto de Perfil (Opcional):</label>
        <input type="file" id="foto-input" accept="image/*" style="padding: 6px; background: #fafafa;">

        <button class="btn-alt" onclick="entrar()">Entrar</button>
        <button onclick="cadastrar()">Criar Nova Conta</button>
    </div>

    <!-- PAINEL DE ADMINISTRADOR -->
    <div id="admin-screen" class="hidden" style="background: #fdfdfd; border: 2px dashed #075e54; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
        <h3 style="font-size: 14px; color: #075e54; margin-bottom: 5px;">⚙️ Painel do Administrador</h3>
        <input type="text" id="novo-banner-texto" placeholder="Texto do banner do topo..." style="font-size: 12px; padding: 6px;">
        <button class="btn-alt" style="padding: 6px; font-size: 12px;" onclick="salvarBanner()">Atualizar Banner</button>
        
        <p style="font-size: 11px; font-weight: bold; margin: 8px 0 3px 0;">Gerenciar Usuários:</p>
        <div id="lista-usuarios-admin" style="max-height: 120px; overflow-y: auto; border: 1px solid #ddd; background: white; border-radius: 4px; padding: 4px;">
            Carregando usuários...
        </div>
        <hr style="margin: 10px 0;">
    </div>

    <!-- TELA DE CONTATOS -->
    <div id="contacts-screen" class="hidden">
        <div class="header-top">
            <div class="user-info-area">
                <img id="meu-avatar-topo" class="avatar" src="" alt="" style="display:none;">
                <div id="meu-avatar-letra" class="avatar" style="display:none;"></div>
                <div>
                    <h3 style="margin:0; font-size: 14px; text-align: left;">Contatos ⚡</h3>
                    <span style="font-size: 11px; color: #555;" id="user-display-contacts"></span>
                </div>
            </div>
            <div>
                <button class="btn-danger" style="padding: 5px 8px; font-size: 11px; width: auto;" onclick="sair()">Sair</button>
            </div>
        </div>
        <div class="contact-list" id="lista-contatos">
            <p style="text-align:center; color:#888; font-size:13px; margin-top:20px;">Carregando...</p>
        </div>
        <button class="btn-alt" style="background: #128c7e; font-size: 13px; padding: 8px;" onclick="indicarAmigo()">📢 Convidar Amigo</button>
    </div>

    <!-- TELA DO CHAT PRIVADO -->
    <div id="chat-screen" class="hidden">
        <div class="header-top">
            <div>
                <button class="btn-alt" style="padding: 3px 8px; font-size: 11px; width: auto; margin-bottom: 3px;" onclick="voltarParaContatos()">⬅️ Voltar</button>
                <h3 id="chat-title" style="margin:0; font-size: 13px; color: #075e54; text-align: left;">Conversando...</h3>
            </div>
            <div>
                <button class="btn-danger" style="padding: 5px 8px; font-size: 11px; width: auto;" onclick="sair()">Sair</button>
            </div>
        </div>

        <div class="chat-box" id="mensagens"></div>
        
        <div class="input-group">
            <input type="text" id="mensagem-texto" placeholder="Digite ou fale (com correção automática)..." onkeypress="if(event.key === 'Enter') enviarMensagemPrivada()">
            <button class="mic-btn" onclick="ouvirVoz()" title="Falar">🎙️</button>
        </div>
        <button onclick="enviarMensagemPrivada()">Enviar com Correção PT</button>
    </div>
</div>

<!-- Scripts do Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, setDoc, doc, getDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDzi_rystX7ymNbkeifTiO-YOxx2A9UCjI",
        authDomain: "zapleve.firebaseapp.com",
        projectId: "zapleve",
        storageBucket: "zapleve.firebasestorage.app",
        messagingSenderId: "426242600158",
        appId: "1:426242600158:web:c2427064b5702948fc264f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const EMAIL_ADMIN = "afiliado9591@gmail.com";

    let usuarioAtual = null;
    let contatoSelecionado = null;
    let unsubscribeChat = null;

    // SISTEMA DE CORREÇÃO ORTOGRÁFICA E PONTUAÇÃO AUTOMÁTICA EM PORTUGUÊS
    function corrigirTextoPortugues(textoOriginal) {
        if (!textoOriginal) return "";
        let texto = textoOriginal.trim();

        // Dicionário local de substituição de termos informais/incorretos comuns
        const dicionarioCorrecoes = {
            "\\bvc\\b": "você",
            "\\bvcs\\b": "vocês",
            "\\btbm\\b": "também",
            "\\bqp\\b": "porque",
            "\\bpq\\b": "porque",
            "\\bpro\\b": "para o",
            "\\bpra\\b": "para a",
            "\\bq\\b": "que",
            "\\btre\\b": "ter",
            "\\btudo bem\\b": "Tudo bem",
            "\\btudo bém\\b": "tudo bem",
            "\\bta\\b": "está",
            "\\bblz\\b": "beleza",
            "\\bedai\\b": "e aí",
            "\\bne\\b": "né",
            "\\bmsm\\b": "mesmo",
            "\\bqm\\b": "quem",
            "\\btq\\b": "tem que",
            "\\bnb\\b": "não"
        };

        // Aplica as substituições do dicionário ignorando maiúsculas/minúsculas nas abreviações
        for (let padrao in dicionarioCorrecoes) {
            let regex = new RegExp(padrao, "gi");
            texto = texto.replace(regex, dicionarioCorrecoes[padrao]);
        }

        // Correções gramaticais automáticas comuns em início/meio de frase
        texto = texto.replace(/\b(nao)\b/gi, "não");
        texto = texto.replace(/\b(tambem)\b/gi, "também");
        texto = texto.replace(/\b(estao)\b/gi, "estão");
        texto = texto.replace(/\b(voce)\b/gi, "você");
        texto = texto.replace(/\b(ola)\b/gi, "olá");
        texto = texto.replace(/\b(ja)\b/gi, "já");

        // Insere vírgulas em pausas comuns de fala natural
        texto = texto.replace(/\b(mas )\b/gi, ", mas ");
        texto = texto.replace(/\b(porque )\b/gi, ", porque ");
        texto = texto.replace(/\b(porem )\b/gi, ", porém ");

        // Ajusta Letra Maiúscula na primeira letra da frase
        texto = texto.charAt(0).toUpperCase() + texto.slice(1);

        // Adiciona ponto final automático se a frase não terminar com pontuação (?, !, .)
        if (!/[.?!]$/.test(texto)) {
            texto += ".";
        }

        return texto;
    }

    function comprimirImagem(file) {
        return new Promise((resolve) => {
            if (!file) { resolve(""); return; }
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 120;
                    const MAX_HEIGHT = 120;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                }
            }
        });
    }

    onSnapshot(doc(db, "config", "banner"), (docSnap) => {
        const bannerDiv = document.getElementById('banner-topo');
        if (docSnap.exists() && docSnap.data().texto) {
            bannerDiv.innerText = docSnap.data().texto;
            bannerDiv.style.display = "block";
            document.getElementById('novo-banner-texto').value = docSnap.data().texto;
        } else {
            bannerDiv.style.display = "none";
        }
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userDocRef = doc(db, "usuarios", user.uid);
            const userDocSnap = await getDoc(userDocRef);
            
            if (userDocSnap.exists() && userDocSnap.data().bloqueado) {
                alert("Sua conta foi bloqueada.");
                await signOut(auth);
                return;
            }

            usuarioAtual = user;
            let dadosUser = userDocSnap.exists() ? userDocSnap.data() : {};
            let fotoBase64 = dadosUser.foto || "";

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('contacts-screen').classList.remove('hidden');
            document.getElementById('user-display-contacts').innerText = user.email;
            
            const imgTopo = document.getElementById('meu-avatar-topo');
            const letraTopo = document.getElementById('meu-avatar-letra');

            if(fotoBase64) {
                imgTopo.src = fotoBase64;
                imgTopo.style.display = "block";
                letraTopo.style.display = "none";
            } else {
                imgTopo.style.display = "none";
                letraTopo.innerText = user.email.charAt(0).toUpperCase();
                letraTopo.style.display = "flex";
            }

            if (user.email.toLowerCase() === EMAIL_ADMIN.toLowerCase()) {
                document.getElementById('admin-screen').classList.remove('hidden');
                carregarAdminUsuarios();
            } else {
                document.getElementById('admin-screen').classList.add('hidden');
            }

            carregarContatos();
        } else {
            usuarioAtual = null;
            contatoSelecionado = null;
            if (unsubscribeChat) unsubscribeChat();
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('contacts-screen').classList.add('hidden');
            document.getElementById('admin-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }
    });

    window.cadastrar = async () => {
        const email = document.getElementById('email').value;
        const senha = document.getElementById('password').value;
        const fotoFile = document.getElementById('foto-input').files[0];
        
        if (!email || !senha) return alert("Preencha e-mail e senha.");
        try {
            const cred = await createUserWithEmailAndPassword(auth, email, senha);
            const fotoBase64 = await comprimirImagem(fotoFile);
            
            await setDoc(doc(db, "usuarios", cred.user.uid), {
                email: email,
                nome: email.split('@')[0],
                foto: fotoBase64,
                ultimoAcesso: serverTimestamp(),
                bloqueado: false
            });

            alert("Conta criada com sucesso!");
        } catch (error) { alert("Erro: " + error.message); }
    };

    window.entrar = async () => {
        const email = document.getElementById('email').value;
        const senha = document.getElementById('password').value;
        const fotoFile = document.getElementById('foto-input').files[0];

        if (!email || !senha) return alert("Preencha e-mail e senha.");
        try {
            const cred = await signInWithEmailAndPassword(auth, email, senha);
            
            if (fotoFile) {
                const fotoBase64 = await comprimirImagem(fotoFile);
                await updateDoc(doc(db, "usuarios", cred.user.uid), { foto: fotoBase64 });
            }
        } catch (error) { alert("Erro: " + error.message); }
    };

    window.sair = async () => { await signOut(auth); };

    window.salvarBanner = async () => {
        const texto = document.getElementById('novo-banner-texto').value;
        await setDoc(doc(db, "config", "banner"), { texto: texto });
        alert("Banner atualizado!");
    };

    async function carregarAdminUsuarios() {
        const snapshot = await getDocs(collection(db, "usuarios"));
        const listaDiv = document.getElementById('lista-usuarios-admin');
        listaDiv.innerHTML = "";
        snapshot.forEach((docItem) => {
            const dados = docItem.data();
            if (dados.email.toLowerCase() !== EMAIL_ADMIN.toLowerCase()) {
                const status = dados.bloqueado ? '<b style="color:red">Banido</b>' : '<span style="color:green">Ativo</span>';
                const txtBtn = dados.bloqueado ? 'Liberar' : 'Bloquear';
                listaDiv.innerHTML += `
                    <div class="user-row">
                        <span>${dados.email.split('@')[0]} (${status})</span>
                        <button class="${dados.bloqueado ? '' : 'btn-danger'}" style="width:auto; padding:2px 6px; font-size:10px;" onclick="mudarBloqueio('${docItem.id}', ${!dados.bloqueado})">${txtBtn}</button>
                    </div>`;
            }
        });
    }

    window.mudarBloqueio = async (uid, bloquear) => {
        await updateDoc(doc(db, "usuarios", uid), { bloqueado: bloquear });
        alert(bloquear ? "Usuário bloqueado!" : "Usuário desbloqueado!");
        carregarAdminUsuarios();
    };

    function carregarContatos() {
        onSnapshot(collection(db, "usuarios"), (snapshot) => {
            const listaDiv = document.getElementById('lista-contatos');
            listaDiv.innerHTML = "";
            let count = 0;
            snapshot.forEach((docItem) => {
                const dados = docItem.data();
                if (dados.email !== usuarioAtual.email && !dados.bloqueado) {
                    count++;
                    const avatarHtml = dados.foto ? `<img class="avatar" src="${dados.foto}">` : `<div class="avatar">${dados.nome.charAt(0).toUpperCase()}</div>`;
                    listaDiv.innerHTML += `
                        <div class="contact-item" onclick="abrirChat('${docItem.id}', '${dados.nome}', '${dados.foto || ''}')">
                            <div class="contact-info">
                                ${avatarHtml}
                                <span class="contact-name">${dados.nome}</span>
                            </div>
                            <span style="font-size: 11px; color: #128c7e; font-weight: bold;">Conversar 💬</span>
                        </div>`;
                }
            });
            if (count === 0) listaDiv.innerHTML = `<p style="text-align:center; color:#888; font-size:12px; margin-top:20px;">Nenhum contato disponível.</p>`;
        });
    }

    window.abrirChat = (uidContato, nomeContato, fotoContato) => {
        contatoSelecionado = { uid: uidContato, nome: nomeContato, foto: fotoContato };
        document.getElementById('chat-title').innerText = "Privado: " + nomeContato;
        document.getElementById('contacts-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');
        escutarMensagensPrivadas();
    };

    window.voltarParaContatos = () => {
        if (unsubscribeChat) unsubscribeChat();
        document.getElementById('chat-screen').classList.add('hidden');
        document.getElementById('contacts-screen').classList.remove('hidden');
        if (usuarioAtual.email.toLowerCase() === EMAIL_ADMIN.toLowerCase()) {
            document.getElementById('admin-screen').classList.add('hidden');
            carregarAdminUsuarios();
        }
    };

    function obterIdSala(uid1, uid2) { return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`; }

    function escutarMensagensPrivadas() {
        const idSala = obterIdSala(usuarioAtual.uid, contatoSelecionado.uid);
        const q = query(collection(db, "conversas", idSala, "mensagens"), orderBy("criadoEm", "asc"));
        if (unsubscribeChat) unsubscribeChat();
        
        getDocs(collection(db, "usuarios")).then((snapUsuarios) => {
            const mapaUsuarios = {};
            snapUsuarios.forEach(u => { mapaUsuarios[u.data().email] = u.data(); });

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const box = document.getElementById('mensagens');
                box.innerHTML = "";
                if (snapshot.empty) {
                    box.innerHTML = `<p style="text-align:center; color:#777; font-size:12px; margin-top:30px;">Chat seguro com corretor ortográfico. Diga olá! 👋</p>`;
                    return;
                }
                snapshot.forEach((docItem) => {
                    const data = docItem.data();
                    const eMinha = data.remetente === usuarioAtual.email;
                    const classeMsg = eMinha ? "msg msg-minha" : "msg";
                    const textoSeguro = data.texto.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    const dadosRemetente = mapaUsuarios[data.remetente] || {};
                    const avatarMsg = dadosRemetente.foto ? `<img class="avatar" style="width:28px; height:28px;" src="${dadosRemetente.foto}">` : `<div class="avatar" style="width:28px; height:28px; font-size:11px;">${data.remetente.charAt(0).toUpperCase()}</div>`;

                    box.innerHTML += `
                        <div class="${classeMsg}">
                            ${avatarMsg}
                            <div class="msg-content">
                                <div style="font-size: 11px; color: ${eMinha ? '#005d4b' : '#075e54'}; font-weight: bold; margin-bottom: 2px;">${data.remetente.split('@')[0]}</div>
                                <div style="font-size: 14px; color: #333; word-break: break-word;">${data.texto}</div>
                                <button class="msg-audio-btn" onclick="falarTexto('${textoSeguro}')">🔊 Ouvir</button>
                            </div>
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        });
    }

    window.enviarMensagemPrivada = async () => {
        const inputEl = document.getElementById('mensagem-texto');
        let textoDigitado = inputEl.value;
        if (!textoDigitado.trim() || !contatoSelecionado) return;

        // APLICA A CORREÇÃO DE PORTUGUÊS AUTOMATICAMENTE ANTES DE ENVIAR
        let textoCorrigido = corrigirTextoPortugues(textoDigitado);

        const idSala = obterIdSala(usuarioAtual.uid, contatoSelecionado.uid);
        try {
            await addDoc(collection(db, "conversas", idSala, "mensagens"), {
                texto: textoCorrigido,
                remetente: usuarioAtual.email,
                criadoEm: serverTimestamp()
            });
            inputEl.value = "";
        } catch (error) { alert("Erro: " + error.message); }
    };

    window.ouvirVoz = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return alert("Navegador sem suporte a voz.");
        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.start();
        const inputEl = document.getElementById('mensagem-texto');
        inputEl.placeholder = "Ouvindo e corrigindo... 🎙️";
        
        recognition.onresult = (e) => {
            let falaTranscrita = e.results[0][0].transcript;
            // Aplica a correção de português e pontuação logo após a transcrição da fala
            inputEl.value = corrigirTextoPortugues(falaTranscrita);
        };
        
        recognition.onerror = recognition.onend = () => { 
            inputEl.placeholder = "Digite ou fale (com correção automática)..."; 
        };
    };

    window.falarTexto = (texto) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR'; // Leitura nativa em português correto
        window.speechSynthesis.speak(utterance);
    };

    window.indicarAmigo = () => {
        prompt("Envie o link do app para seu amigo:", window.location.href);
    };
</script>

</body>
</html>

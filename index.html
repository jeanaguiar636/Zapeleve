<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zap Leve - FIX</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:Arial;background:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{width:90%;max-width:350px;text-align:center}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:6px;border:1px solid #ccc}
button{background:#00a884;color:#fff;font-weight:bold;border:none}
#log{font-size:12px;color:red;min-height:18px}
</style>
</head>
<body>
<div class="box">
<h2>⚡ Zap Leve - TESTE</h2>
<input id="email" type="email" placeholder="email" value="">
<input id="password" type="password" placeholder="senha">
<button id="btnEntrar">Entrar</button>
<button id="btnCadastrar" style="background:#28a745">Abrir Conta</button>
<p id="log"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// TODO: COLE SUA CONFIG REAL AQUI - ESSA É A CAUSA Nº1 DE NÃO FUNCIONAR
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI.firebaseapp.com",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI.appspot.com",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const log = msg => { $('log').textContent = msg; console.log(msg); };

// DEFINIÇÃO CORRETA - SEM ONCLICK NO HTML
async function entrar(){
  const e = $('email').value.trim();
  const s = $('password').value.trim();
  if(!e||!s){ log('Preencha email e senha'); return; }
  log('Entrando...');
  try{
    await signInWithEmailAndPassword(auth,e,s);
    log('✅ Logado! Redirecionando...');
    // aqui você redireciona para seu app real
  }catch(err){
    log('❌ '+err.code+' - '+err.message);
  }
}
async function cadastrar(){
  const e = $('email').value.trim();
  const s = $('password').value.trim();
  if(!e||!s){ log('Preencha email e senha'); return; }
  log('Criando...');
  try{
    const cred = await createUserWithEmailAndPassword(auth,e,s);
    await setDoc(doc(db,'users',cred.user.uid),{email:e, nome:e.split('@')[0], criado:Date.now()});
    log('✅ Conta criada!');
  }catch(err){
    log('❌ '+err.code+' - '+err.message);
  }
}

// LIGA OS BOTÕES - ISSO RESOLVE O entrar is not defined
$('btnEntrar').addEventListener('click', entrar);
$('btnCadastrar').addEventListener('click', cadastrar);

// Expõe no window só por compatibilidade
window.entrar = entrar;
window.cadastrar = cadastrar;

log('JS carregado - entrar() = '+typeof entrar);

// Remove service worker antigo que prende cache
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  });
}
</script>

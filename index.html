<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zap Leve - Chat & Chamadas P2P Grátis</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
    <style>
        :root {
            --bg-app: #ffffff;
            --text-app: #111111;
            --header-bg: #00a884;
            --chat-bg: #efeae2;
            --input-bg: #f0f2f5;
            --msg-minha: #d9fdd3;
            --msg-outra: #ffffff;
            --border-color: #d1d7db;
        }
        body.dark-mode {
            --bg-app: #111b21;
            --text-app: #e9edef;
            --header-bg: #202c33;
            --chat-bg: #0b141a;
            --input-bg: #202c33;
            --msg-minha: #005c4b;
            --msg-outra: #202c33;
            --border-color: #222d34;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-app); color: var(--text-app); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background-color: var(--header-bg); color: white; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; height: 60px; flex-shrink: 0; }
        .header-title { font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .header-actions button { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        #chat-container { flex: 1; background-color: var(--chat-bg); background-image: radial-gradient(#d1d7db 0.75px, transparent 0.75px); background-size: 24px 24px; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 7.5px; position: relative; word-wrap: break-word; font-size: 0.95rem; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .message.minha { background-color: var(--msg-minha); align-self: flex-end; border-top-right-radius: 0; }
        .message.outra { background-color: var(--msg-outra); align-self: flex-start; border-top-left-radius: 0; }
        .message .time { font-size: 0.65rem; color: #667781; float: right; margin-top: 4px; margin-left: 8px; line-height: 15px; }
        .input-container { background-color: var(--input-bg); padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .input-container input { flex: 1; background-color: var(--bg-app); color: var(--text-app); border: none; padding: 10px 14px; border-radius: 8px; font-size: 1rem; outline: none; }
        .input-container button { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #54656f; padding: 5px; }
        .input-container button.gravando { color: #dc3545; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <div class="header-title">💬 Zap Leve</div>
        <div class="header-actions">
            <button onclick="indicarAmigo()" title="Indicar Amigo">🔗</button>
            <button onclick="toggleDarkMode()" title="Modo Escuro">🌓</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="message outra">
            Bem-vindo ao Zap Leve! O seu chat P2P está pronto.
            <span class="time">Agora</span>
        </div>
    </div>

    <div class="input-container">
        <button id="btnAudio" onclick="toggleAudio()">🎙️</button>
        <input type="text" id="msgInput" placeholder="Digite uma mensagem..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
        <button onclick="enviarMensagem()">📤</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzi_rystX7ymNbkeifTiO-YOxx2A9UCjI",
            authDomain: "zapleve.firebaseapp.com",
            projectId: "zapleve",
            storageBucket: "zapleve.firebasestorage.app",
            messagingSenderId: "426242600158",
            appId: "1:426242600158:web:09b519b9aa014667fc264f"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        console.log("Firebase inicializado com sucesso!");
    </script>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        function enviarMensagem() {
            const input = document.getElementById('msgInput');
            const texto = input.value.trim();
            if(!texto) return;

            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message minha';
            
            const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `${escapeHtml(texto)} <span class="time">${hora}</span>`;
            
            container.appendChild(msgDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        let mediaRecorder;
        let audioChunks = [];

        window.toggleAudio = async () => {
            const btnAudio = document.getElementById('btnAudio');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                    });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        try { 
                            const container = document.getElementById('chat-container');
                            const msgDiv = document.createElement('div');
                            msgDiv.className = 'message minha';
                            msgDiv.innerHTML = `🎙️ Áudio gravado <span class="time">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
                            container.appendChild(msgDiv);
                            container.scrollTop = container.scrollHeight;
                        } catch (e) { alert('Erro ao enviar áudio: ' + e.message); }
                    };
                    mediaRecorder.start();
                    btnAudio.classList.add('gravando');
                    btnAudio.innerText = "⏹️";
                } catch (err) {
                    alert("Erro ao aceder ao microfone. Verifique as permissões do seu navegador: " + err.message);
                }
            } else {
                mediaRecorder.stop();
                if(mediaRecorder.stream) {
                    mediaRecorder.stream.getTracks().forEach(t => t.stop());
                }
                btnAudio.classList.remove('gravando');
                btnAudio.innerText = "🎙️";
            }
        };

        window.indicarAmigo = () => { prompt("Copie o link:", window.location.href); };
    </script>

</body>
</html>

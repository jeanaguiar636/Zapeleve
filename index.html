<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zap Leve - Chat & Chamadas</title>
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Zap%20Leve%22%2C%22short_name%22%3A%22ZapLeve%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23075e54%22%2C%22icons%22%3A%5B%5D%7D">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23075e54' d='M12 2a10 10 0 0 1 7.54 16.6l1.32 3.96-4.1-1.32A10 10 0 1 1 12 2m0 2a8 8 0 1 0 8 8 8 8 0 0 0-8-8z'/%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        .container { width: 100%; height: 100%; background: white; display: flex; flex-direction: column; position: relative; }
        .hidden { display: none !important; }
        
        .screen-content { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; background: #ffffff; width: 100%; }
        .logo-area { text-align: center; margin: 20px 0; }
        .logo-area span { font-size: 50px; }
        .logo-area h1 { font-size: 28px; color: #075e54; margin: 5px 0 0; }
        
        #banner-topo { background: #075e54; color: white; padding: 12px; text-align: center; font-size: 13px; font-weight: bold; display: none; }
        
        input, textarea, button, select { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #d1d7db; border-radius: 6px; font-size: 16px; }
        input:focus { border-color: #00a884; outline: none; }
        button { background: #00a884; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #008f72; }
        .btn-alt { background: #075e54; }
        .btn-danger { background: #ea0938; }

        .btn-install { background: #128c7e; margin-top: 15px; font-size: 16px; padding: 14px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-install:hover { background: #077265; }

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 20px auto; padding: 20px; max-width: 300px; border-radius: 8px; text-align: center; }
        .close-modal { background: #ea0938; padding: 8px 15px; margin-top: 15px; display: inline-block; border-radius: 4px; color: white; text-decoration: none; }
        
        .contact-list { flex: 1; border: none; overflow-y: auto; padding: 0; margin-bottom: 8px; background: #fff; }
        .contact-item { padding: 14px 12px; border-bottom: 1px solid #f0f2f5; cursor: pointer; display: flex; align-items: center; gap: 14px; }
        .contact-item:hover { background: #f3f6f6; }
        .contact-info { display: flex; align-items: center; gap: 14px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #075e54; display: flex; align-items: center; justify-content: center; color: white; font-weight: 500; font-size: 18px; }
        .contact-name { font-weight: 500; color: #111; font-size: 16px; }

        .chat-box { flex: 1; border: none; overflow-y: auto; padding: 16px; margin-bottom: 8px; background: #efeae2; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 65%; word-break: break-word; font-size: 14px; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .msg-minha { background: #dcf8c6; margin-left: auto; display: flex; flex-direction: column; }
        .msg-outra { background: #fff; }
        .msg-content { flex: 1; }
        .msg-audio-btn, .msg-download-btn { background: #00a884; border: none; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; margin-top: 5px; }
        .msg-download-btn { background: #075e54; margin-left: 5px; }

        .chat-input-area { display: flex; flex-direction: column; background: #f0f2f5; padding: 10px 14px; border-top: 1px solid #d1d7db; }
        .input-group { display: flex; gap: 8px; align-items: center; width: 100%; }
        .input-group input { margin: 0; background: #fff; border-radius: 24px; padding: 12px 16px; }
        
        .action-btn { width: 46px; height: 46px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .mic-rec-btn { background: #00a884; color: white; border: none; }
        .mic-rec-btn.gravando { background: #ea0938; animation: pulsar 1.2s infinite; }
        .video-btn-label { background: #07d888; color: white; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; flex-shrink: 0; }
        @keyframes pulsar { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .header-topo { display: flex; justify-content: space-between; align-items: center; background: #075e54; color: white; padding: 14px 16px; }
        .user-info-area { display: flex; align-items: center; gap: 14px; }
        .file-upload-label { display: block; font-size: 14px; color: #444; text-align: center; margin-top: 8px; cursor: pointer; }
        video, audio { max-width: 100%; border-radius: 6px; margin-top: 8px; background: #000; }

        /* Tela de Chamada */
        #call-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b141a; z-index: 9999; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .call-videos { display: flex; flex: 1; justify-content: center; align-items: center; position: relative; }
        .remote-video { width: 100%; max-height: 70vh; object-fit: cover; border-radius: 12px; background: #222; }
        .local-video { width: 110px; height: 150px; object-fit: cover; border-radius: 8px; position: absolute; bottom: 20px; right: 20px; border: 2px solid #fff; }
        .call-controls { display: flex; justify-content: center; gap: 20px; padding-bottom: 20px; }
        .call-end-btn { background: #ea0938; width: 65px; height: 65px; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div id="banner-topo"></div>

        <!-- TELA DE LOGIN -->
        <div id="auth-screen" class="screen-content" style="justify-content: center;">
            <div class="logo-area">
                <span>💬</span>
                <h1>Zap Leve</h1>
            </div>
            <div style="background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <input type="email" id="email" placeholder="Seu e-mail">
                <input type="password" id="senha" placeholder="Sua senha">
                <button id="btn-login" style="margin-top: 10px;">Entrar / Criar Conta</button>
            </div>
            <button id="btn-install-app" class="btn-install">📥 Instalar Aplicativo no Telemóvel</button>
        </div>

        <!-- TELA PRINCIPAL DO CHAT (Inicia oculta até fazer login) -->
        <div id="app-screen" class="screen-content hidden" style="padding: 0;">
            <div class="header-topo">
                <div class="user-info-area">
                    <span id="user-info-display" style="font-weight: 500;">Chat Geral</span>
                </div>
                <button id="btn-logout" class="btn-danger" style="width: auto; padding: 6px 12px; margin: 0; font-size: 14px;">Sair</button>
            </div>
            <div id="chat-messages" class="chat-box">
                <!-- As mensagens do Firebase aparecem aqui dinamicamente -->
            </div>
            <div class="chat-input-area">
                <div class="input-group">
                    <input type="text" id="mensagem-input" placeholder="Escreva uma mensagem...">
                    <button id="btn-enviar-msg" style="width: 50px; border-radius: 50%;">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DO FIREBASE E LÓGICA DO APLICATIVO -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Configurações do Firebase do projeto Zap Leve
        const firebaseConfig = {
            apiKey: "AIzaSyDzi_rystX7ymNbkeifTiO-YOxx2A9UCjI",
            authDomain: "zapleve.firebaseapp.com",
            projectId: "zapleve",
            storageBucket: "zapleve.firebasestorage.app",
            messagingSenderId: "426242600158",
            appId: "1:426242600158:web:c2427064b5702948fc264f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const userInfoDisplay = document.getElementById('user-info-display');
        const chatMessages = document.getElementById('chat-messages');
        const mensagemInput = document.getElementById('mensagem-input');
        const btnEnviarMsg = document.getElementById('btn-enviar-msg');

        let unsubscribeMensagens = null;

        // Ação de Login ou Criação Automática de Conta
        btnLogin.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const senha = senhaInput.value.trim();

            if (!email || !senha) {
                alert('Por favor, preencha o e-mail e a senha.');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, senha);
            } catch (error) {
                try {
                    await createUserWithEmailAndPassword(auth, email, senha);
                    alert('Conta criada e conectada com sucesso!');
                } catch (createError) {
                    alert('Erro ao autenticar: ' + createError.message);
                }
            }
        });

        // Botão Sair da Conta
        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        // Enviar mensagem para o Firestore
        btnEnviarMsg.addEventListener('click', async () => {
            const texto = mensagemInput.value.trim();
            if (!texto) return;

            try {
                await addDoc(collection(db, "mensagens_geral"), {
                    texto: texto,
                    remetente: auth.currentUser.email,
                    criadoEm: serverTimestamp()
                });
                mensagemInput.value = '';
            } catch (err) {
                alert('Erro ao enviar mensagem: ' + err.message);
            }
        });

        // Enviar com a tecla Enter
        mensagemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnEnviarMsg.click();
            }
        });

        // Monitor de Sessão (Gerencia a troca de telas e escuta as mensagens)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                userInfoDisplay.textContent = `Logado: ${user.email}`;

                // Carrega mensagens em tempo real do banco de dados
                if (unsubscribeMensagens) unsubscribeMensagens();
                const q = query(collection(db, "mensagens_geral"), orderBy("criadoEm", "asc"));
                unsubscribeMensagens = onSnapshot(q, (snapshot) => {
                    chatMessages.innerHTML = '';
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const div = document.createElement('div');
                        const minhaMsg = data.remetente === user.email;
                        div.className = minhaMsg ? 'msg msg-minha' : 'msg msg-outra';
                        div.innerHTML = `<small style="display:block; font-size:10px; color:#555; margin-bottom:2px;">${data.remetente}</small>${data.texto}`;
                        chatMessages.appendChild(div);
                    });
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                });
            } else {
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
                if (unsubscribeMensagens) unsubscribeMensagens();
            }
        });
    </script>

    <!-- Script de suporte PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }
    </script>
</body>
</html>

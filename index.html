<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zap Leve - Chat & Vitrine de Afiliados P2P</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        whatsapp: { 500: '#25D366', 600: '#1ebe5d', dark: '#0b141a', panel: '#111b21', chat: '#202c33' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden font-sans">

    <!-- Container Principal do App -->
    <div id="app" class="flex flex-col md:flex-row h-full w-full max-w-7xl mx-auto shadow-2xl overflow-hidden bg-whatsapp-dark border border-slate-800 relative">
        
        <!-- Sidebar (Ocultável em mobile quando visualizando chat ou ajustada) -->
        <aside id="sidebar-panel" class="w-full md:w-80 lg:w-96 bg-whatsapp-panel border-r border-slate-800 flex flex-col h-full z-20 flex-shrink-0">
            <!-- Header do Usuário -->
            <div class="p-3 md:p-4 bg-slate-900 flex items-center justify-between border-b border-slate-800">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <div id="user-avatar" class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-whatsapp-500 flex items-center justify-center font-bold text-white shrink-0">ZL</div>
                    <div class="truncate">
                        <h2 id="user-name" class="font-semibold text-xs md:text-sm truncate">Carregando...</h2>
                        <span class="text-[10px] md:text-xs text-whatsapp-500 flex items-center gap-1"><i class="fa-solid fa-circle text-[6px]"></i> Online (R2 Ativo)</span>
                    </div>
                </div>
                <div class="flex items-center space-x-2 md:space-x-3 text-slate-400 shrink-0">
                    <button onclick="zapApp.switchTab('chats')" title="Conversas" class="p-1.5 hover:text-white"><i class="fa-solid fa-comments text-base"></i></button>
                    <button onclick="zapApp.switchTab('vitrine')" title="Vitrine / Lojinha" class="p-1.5 hover:text-white"><i class="fa-solid fa-store text-base"></i></button>
                    <button onclick="zapApp.openSettings()" title="Configurações" class="p-1.5 hover:text-white"><i class="fa-solid fa-gear text-base"></i></button>
                </div>
            </div>

            <!-- Pesquisa -->
            <div class="p-3 bg-whatsapp-panel/50">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-slate-500 text-xs"></i>
                    <input type="text" placeholder="Pesquisar conversas ou produtos..." class="w-full bg-slate-800 text-xs md:text-sm rounded-lg pl-9 pr-4 py-2 focus:outline-none focus:ring-1 focus:ring-whatsapp-500 text-slate-200">
                </div>
            </div>

            <!-- Lista Dinâmica (Conversas ou Lojinha/Vitrine) -->
            <div id="sidebar-content" class="flex-1 overflow-y-auto divide-y divide-slate-800/50">
                <!-- Injetado dinamicamente via JS -->
            </div>
        </aside>

        <!-- Área Central (Chat ou Gestão de Lojinha) -->
        <main class="flex-1 flex flex-col h-full bg-slate-900 relative overflow-hidden">
            
            <!-- Header do Chat -->
            <div id="chat-header" class="p-3 md:p-4 bg-whatsapp-panel border-b border-slate-800 flex items-center justify-between shadow-sm shrink-0">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <button onclick="zapApp.toggleMobileSidebar()" class="md:hidden text-slate-300 hover:text-white mr-1 text-lg"><i class="fa-solid fa-bars"></i></button>
                    <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-slate-300 shrink-0">#</div>
                    <div class="truncate">
                        <h3 id="current-chat-title" class="font-semibold text-xs md:text-sm truncate">Selecione uma conversa ou lojinha</h3>
                        <span id="current-chat-status" class="text-[10px] md:text-xs text-slate-400 truncate block">P2P e Cloudflare R2 Prontos</span>
                    </div>
                </div>
                <div class="flex items-center space-x-3 text-slate-300 shrink-0">
                    <button onclick="zapApp.startCall('video')" title="Vídeo Chamada P2P" class="p-1 hover:text-whatsapp-500"><i class="fa-solid fa-video"></i></button>
                    <button onclick="zapApp.startCall('audio')" title="Chamada de Voz P2P" class="p-1 hover:text-whatsapp-500"><i class="fa-solid fa-phone"></i></button>
                </div>
            </div>

            <!-- Container Principal de Conteúdo (Mensagens ou Vitrine de Afiliado) -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-3 md:p-4 space-y-4 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px] bg-slate-950/60">
                <div class="flex flex-col items-center justify-center h-full text-slate-500 space-y-2 text-center p-4">
                    <i class="fa-solid fa-bolt text-4xl text-whatsapp-500"></i>
                    <p class="text-xs md:text-sm">Bem-vindo ao Zap Leve. Selecione uma opção na barra lateral ou menu.</p>
                </div>
            </div>

            <!-- Barra de Envio (Chat) -->
            <div id="chat-input-bar" class="p-2 md:p-3 bg-whatsapp-panel border-t border-slate-800 flex items-center space-x-2 shrink-0">
                <label class="cursor-pointer text-slate-400 hover:text-whatsapp-500 p-2 shrink-0" title="Enviar Mídia (Salva no R2)">
                    <i class="fa-solid fa-paperclip text-base md:text-lg"></i>
                    <input type="file" id="media-input" class="hidden" onchange="zapApp.handleMediaUpload(event)">
                </label>
                <input type="text" id="message-input" placeholder="Digite uma mensagem..." class="flex-1 bg-slate-800 text-xs md:text-sm rounded-lg px-3 md:px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-whatsapp-500 text-slate-200" onkeypress="zapApp.handleKeyPress(event)">
                <button onclick="zapApp.sendMessage()" class="bg-whatsapp-500 hover:bg-whatsapp-600 text-white px-3 md:px-4 py-2.5 rounded-lg font-medium transition-colors shrink-0">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs e Lógica do App -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzi_rystX7ymNbkeifTiO-YOxx2A9UCjI",
            authDomain: "zapleve.firebaseapp.com",
            projectId: "zapleve",
            storageBucket: "zapleve.firebasestorage.app",
            messagingSenderId: "426242600158",
            appId: "1:426242600158:web:9bf280a9379bccc6fc264f"
        };

        const appFB = initializeApp(firebaseConfig);
        const auth = getAuth(appFB);
        const db = getFirestore(appFB);

        const R2_PUBLIC_URL = "https://cdn.alibr.com.br";

        class ZapLeveApp {
            constructor() {
                this.currentUser = null;
                this.currentChatId = "geral";
                this.currentView = "chats";
                this.mobileSidebarOpen = true;
                this.initAuth();
            }

            initAuth() {
                signInAnonymously(auth).catch(error => console.error("Erro auth:", error));
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        this.currentUser = user;
                        document.getElementById('user-name').innerText = `User_${user.uid.substring(0, 5)}`;
                        document.getElementById('user-avatar').innerText = user.uid.substring(0, 2).toUpperCase();
                        this.loadSidebar();
                        this.loadMessages();
                    }
                });
            }

            toggleMobileSidebar() {
                const sidebar = document.getElementById('sidebar-panel');
                if (window.innerWidth < 768) {
                    sidebar.classList.toggle('hidden');
                }
            }

            switchTab(tab) {
                this.currentView = tab;
                if (tab === 'vitrine') {
                    this.renderStoreView();
                } else {
                    this.loadMessages();
                }
                if (window.innerWidth < 768) {
                    document.getElementById('sidebar-panel').classList.add('hidden');
                }
            }

            openSettings() {
                const storeName = prompt("Digite o nome da sua Lojinha (Slug amigável, ex: lojadaju):");
                if (storeName) {
                    this.saveStoreSlug(storeName);
                }
            }

            async saveStoreSlug(name) {
                if (!this.currentUser) return;
                const slug = name.toLowerCase().replace(/\s+/g, '-');
                try {
                    await setDoc(doc(db, "users", this.currentUser.uid), {
                        storeName: name,
                        storeSlug: slug
                    }, { merge: true });
                    alert(`Lojinha configurada com sucesso! Seu link:\nlocation.origin/?store=${slug}`);
                } catch (e) {
                    console.error("Erro ao salvar lojinha:", e);
                }
            }

            loadSidebar() {
                const sidebar = document.getElementById('sidebar-content');
                sidebar.innerHTML = `
                    <div class="p-3 hover:bg-slate-800/50 cursor-pointer flex items-center justify-between" onclick="zapApp.loadMessages(); zapApp.toggleMobileSidebar();">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-whatsapp-500/20 text-whatsapp-500 flex items-center justify-center"><i class="fa-solid fa-comments"></i></div>
                            <div>
                                <h4 class="text-xs md:text-sm font-semibold">Chat Geral / Suporte</h4>
                                <p class="text-[10px] text-slate-400">Canal Principal P2P</p>
                            </div>
                        </div>
                    </div>
                    <div class="p-3 hover:bg-slate-800/50 cursor-pointer flex items-center justify-between" onclick="zapApp.switchTab('vitrine')">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-amber-500/20 text-amber-500 flex items-center justify-center"><i class="fa-solid fa-store"></i></div>
                            <div>
                                <h4 class="text-xs md:text-sm font-semibold">Minha Vitrine de Afiliado</h4>
                                <p class="text-[10px] text-slate-400">Gerenciar produtos e links</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            async loadMessages() {
                document.getElementById('chat-input-bar').style.display = 'flex';
                document.getElementById('current-chat-title').innerText = "Chat Geral & Comunidade";
                const container = document.getElementById('messages-container');
                container.innerHTML = `<div class="flex justify-center p-4"><i class="fa-solid fa-spinner animate-spin text-whatsapp-500 text-xl"></i></div>`;

                try {
                    const q = query(collection(db, "chats", this.currentChatId, "messages"), orderBy("timestamp", "desc"), limit(25));
                    const querySnapshot = await getDocs(q);
                    
                    container.innerHTML = "";
                    const messages = [];
                    querySnapshot.forEach((doc) => messages.unshift(doc.data()));

                    if (messages.length === 0) {
                        container.innerHTML = `<div class="text-center text-slate-500 py-10 text-xs">Nenhuma mensagem ainda. Envie a primeira!</div>`;
                        return;
                    }

                    messages.forEach(msg => this.renderMessageElement(msg));
                } catch (e) {
                    console.error("Erro ao carregar mensagens:", e);
                }
            }

            renderMessageElement(msg) {
                const container = document.getElementById('messages-container');
                const isMe = msg.sender === this.currentUser.uid;
                
                const div = document.createElement('div');
                div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

                let mediaContent = '';
                if (msg.mediaUrl) {
                    if (msg.mediaType === 'image') {
                        mediaContent = `
                            <div class="mt-2">
                                <img src="${msg.mediaUrl}" loading="lazy" class="rounded-lg max-w-[240px] max-h-48 object-cover cursor-pointer mb-2" onclick="window.open('${msg.mediaUrl}', '_blank')">
                                <a href="${msg.mediaUrl}" target="_blank" download class="inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded text-[10px] font-bold shadow">
                                    <i class="fa-solid fa-download"></i> Baixar Imagem
                                </a>
                            </div>`;
                    } else {
                        mediaContent = `
                            <div class="mt-2">
                                <a href="${msg.mediaUrl}" target="_blank" download class="inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded text-[10px] font-bold shadow">
                                    <i class="fa-solid fa-file"></i> Baixar Arquivo
                                </a>
                            </div>`;
                    }
                }

                div.innerHTML = `
                    <div class="max-w-[85%] md:max-w-md rounded-lg p-3 shadow ${isMe ? 'bg-whatsapp-chat text-white rounded-tr-none' : 'bg-slate-800 text-slate-200 rounded-tl-none'}">
                        <p class="text-xs md:text-sm break-words">${msg.text || ''}</p>
                        ${mediaContent}
                        <span class="block text-[9px] text-slate-400 text-right mt-1">Agora</span>
                    </div>
                `;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }

            renderStoreView() {
                document.getElementById('chat-input-bar').style.display = 'none';
                document.getElementById('current-chat-title').innerText = "Painel da Vitrine de Afiliado";
                const container = document.getElementById('messages-container');
                
                container.innerHTML = `
                    <div class="max-w-xl mx-auto space-y-4 pb-6">
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
                            <h3 class="font-bold text-sm text-whatsapp-500 mb-3 flex items-center gap-2"><i class="fa-solid fa-plus-circle"></i> Cadastrar Produto na Lojinha</h3>
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1">Nome do Produto</label>
                                    <input type="text" id="prod-title" placeholder="Ex: Tênis Esportivo" class="w-full bg-slate-900 text-xs md:text-sm rounded p-2.5 text-white border border-slate-700 focus:ring-1 focus:ring-whatsapp-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1">Preço</label>
                                    <input type="text" id="prod-price" placeholder="Ex: R$ 89,90" class="w-full bg-slate-900 text-xs md:text-sm rounded p-2.5 text-white border border-slate-700 focus:ring-1 focus:ring-whatsapp-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1">Link de Afiliado</label>
                                    <input type="text" id="prod-url" placeholder="https://shopee.com.br/..." class="w-full bg-slate-900 text-xs md:text-sm rounded p-2.5 text-white border border-slate-700 focus:ring-1 focus:ring-whatsapp-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1">Foto do Produto (Cloudflare R2):</label>
                                    <input type="file" id="prod-img-file" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600">
                                </div>
                                <button onclick="zapApp.salvarProdutoAfiliado()" class="w-full bg-whatsapp-500 hover:bg-whatsapp-600 text-white py-2.5 rounded font-semibold text-xs md:text-sm transition-colors shadow">Adicionar Produto</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            async salvarProdutoAfiliado() {
                const title = document.getElementById('prod-title').value;
                const price = document.getElementById('prod-price').value;
                const url = document.getElementById('prod-url').value;
                const fileInput = document.getElementById('prod-img-file').files[0];

                if (!title || !price || !url) {
                    alert("Preencha todos os campos obrigatórios!");
                    return;
                }

                const mockR2ImageUrl = fileInput ? `${R2_PUBLIC_URL}/products/${Date.now()}_${fileInput.name}` : "https://via.placeholder.com/150";

                try {
                    await addDoc(collection(db, "products"), {
                        ownerId: this.currentUser.uid,
                        title: title,
                        price: price,
                        affiliateUrl: url,
                        imageUrl: mockR2ImageUrl,
                        timestamp: serverTimestamp()
                    });
                    alert("Produto cadastrado com sucesso!");
                    document.getElementById('prod-title').value = "";
                    document.getElementById('prod-price').value = "";
                    document.getElementById('prod-url').value = "";
                } catch (e) {
                    console.error("Erro ao salvar produto:", e);
                }
            }

            async handleMediaUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const mockR2Url = `${R2_PUBLIC_URL}/uploads/${Date.now()}_${file.name}`;
                const mediaType = file.type.startsWith('image') ? 'image' : 'file';

                try {
                    await addDoc(collection(db, "chats", this.currentChatId, "messages"), {
                        sender: this.currentUser.uid,
                        text: `[Arquivo: ${file.name}]`,
                        mediaUrl: mockR2Url,
                        mediaType: mediaType,
                        timestamp: serverTimestamp()
                    });
                    this.loadMessages();
                } catch (e) {
                    console.error("Erro ao enviar mídia:", e);
                }
            }

            async sendMessage() {
                const input = document.getElementById('message-input');
                const text = input.value.trim();
                if (!text) return;

                input.value = "";
                try {
                    await addDoc(collection(db, "chats", this.currentChatId, "messages"), {
                        sender: this.currentUser.uid,
                        text: text,
                        mediaUrl: null,
                        mediaType: null,
                        timestamp: serverTimestamp()
                    });
                    this.loadMessages();
                } catch (e) {
                    console.error("Erro ao enviar mensagem:", e);
                }
            }

            handleKeyPress(e) {
                if (e.key === 'Enter') this.sendMessage();
            }

            startCall(type) {
                alert(`Iniciando chamada P2P (${type}) via WebRTC.`);
            }
        }

        const zapApp = new ZapLeveApp();
        window.zapApp = zapApp;
    </script>
</body>
</html>

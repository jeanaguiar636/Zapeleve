<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zap Leve - Chat & Afiliados P2P</title>
    <!-- Tailwind CSS para Estilização Moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        whatsapp: { 500: '#25D366', 600: '#1ebe5d', dark: '#0b141a', panel: '#111b21', chat: '#202c33' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Container Principal do App -->
    <div id="app" class="flex h-full w-full max-w-7xl mx-auto shadow-2xl overflow-hidden bg-whatsapp-dark border border-slate-800">
        
        <!-- Sidebar de Navegação / Conversas -->
        <aside class="w-full md:w-80 lg:w-96 bg-whatsapp-panel border-r border-slate-800 flex flex-col h-full z-10">
            <!-- Header do Usuário -->
            <div class="p-4 bg-slate-900 flex items-center justify-between border-b border-slate-800">
                <div class="flex items-center space-x-3">
                    <div id="user-avatar" class="w-10 h-10 rounded-full bg-whatsapp-500 flex items-center justify-center font-bold text-white">ZL</div>
                    <div>
                        <h2 id="user-name" class="font-semibold text-sm">Carregando...</h2>
                        <span class="text-xs text-whatsapp-500 flex items-center gap-1"><i class="fa-solid fa-circle text-[8px]"></i> Online (R2 Conectado)</span>
                    </div>
                </div>
                <div class="flex items-center space-x-3 text-slate-400">
                    <button onclick="app.switchTab('channels')" title="Canais de Nicho" class="hover:text-white"><i class="fa-solid fa-bullhorn"></i></button>
                    <button onclick="app.switchTab('vitrine')" title="Vitrine de Afiliados" class="hover:text-white"><i class="fa-solid fa-store"></i></button>
                    <button onclick="app.openSettings()" title="Configurações" class="hover:text-white"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>

            <!-- Barra de Pesquisa e Atalhos -->
            <div class="p-3 bg-whatsapp-panel/50">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-slate-500 text-sm"></i>
                    <input type="text" placeholder="Pesquisar ou começar uma nova conversa..." class="w-full bg-slate-800 text-sm rounded-lg pl-9 pr-4 py-2 focus:outline-none focus:ring-1 focus:ring-whatsapp-500 text-slate-200">
                </div>
            </div>

            <!-- Lista de Abas (Conversas / Canais / Afiliados) -->
            <div id="sidebar-content" class="flex-1 overflow-y-auto divide-y divide-slate-800/50">
                <!-- Itens injetados via JS -->
            </div>
        </aside>

        <!-- Área Central de Chat / Mídia / P2P -->
        <main class="flex-1 flex flex-col h-full bg-slate-900 relative">
            <!-- Header do Chat Ativo -->
            <div id="chat-header" class="p-4 bg-whatsapp-panel border-b border-slate-800 flex items-center justify-between shadow-sm">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-slate-300">#</div>
                    <div>
                        <h3 id="current-chat-title" class="font-semibold text-sm">Selecione uma conversa</h3>
                        <span id="current-chat-status" class="text-xs text-slate-400">Cloudflare R2 Otimizado</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4 text-slate-300">
                    <button onclick="app.startCall('video')" title="Vídeo Chamada P2P" class="hover:text-whatsapp-500"><i class="fa-solid fa-video"></i></button>
                    <button onclick="app.startCall('audio')" title="Chamada de Voz P2P" class="hover:text-whatsapp-500"><i class="fa-solid fa-phone"></i></button>
                </div>
            </div>

            <!-- Corpo das Mensagens (Com Paginação e Lazy Load) -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px] bg-slate-950/60">
                <div class="flex flex-col items-center justify-center h-full text-slate-500 space-y-2">
                    <i class="fa-solid fa-comments text-4xl"></i>
                    <p class="text-sm">Nenhuma conversa selecionada. Suas mídias são carregadas sob demanda do Cloudflare R2.</p>
                </div>
            </div>

            <!-- Barra de Envio de Mensagem e Upload R2 -->
            <div class="p-3 bg-whatsapp-panel border-t border-slate-800 flex items-center space-x-3">
                <label class="cursor-pointer text-slate-400 hover:text-whatsapp-500 p-2" title="Enviar Mídia (Salva no R2, Metadado no Firebase)">
                    <i class="fa-solid fa-paperclip text-lg"></i>
                    <input type="file" id="media-input" class="hidden" onchange="app.handleMediaUpload(event)">
                </label>
                <button onclick="app.toggleQuickReplies()" class="text-slate-400 hover:text-whatsapp-500 p-2" title="Respostas Rápidas">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </button>
                <input type="text" id="message-input" placeholder="Digite uma mensagem..." class="flex-1 bg-slate-800 text-sm rounded-lg px-4 py-3 focus:outline-none focus:ring-1 focus:ring-whatsapp-500 text-slate-200" onkeypress="app.handleKeyPress(event)">
                <button onclick="app.sendMessage()" class="bg-whatsapp-500 hover:bg-whatsapp-600 text-white px-4 py-3 rounded-lg font-medium transition-colors">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs (Modular V10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURAÇÕES DO FIREBASE (Substitua pelas suas credenciais)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-projeto",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const appFB = initializeApp(firebaseConfig);
        const auth = getAuth(appFB);
        const db = getFirestore(appFB);

        // CONFIGURAÇÃO DO CLOUDFLARE R2 (Workers / Endpoint configurado)
        const R2_PUBLIC_URL = "https://cdn.seudominio.com"; // Seu subdominio vinculado ao R2

        class ZapLeveApp {
            constructor() {
                this.currentUser = null;
                this.currentChatId = "geral";
                this.initAuth();
            }

            initAuth() {
                signInAnonymously(auth).catch(error => console.error("Erro auth anonima:", error));
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        this.currentUser = user;
                        document.getElementById('user-name').innerText = `User_${user.uid.substring(0, 5)}`;
                        document.getElementById('user-avatar').innerText = user.uid.substring(0, 2).toUpperCase();
                        this.loadMessages();
                    }
                });
            }

            switchTab(tab) {
                alert(`Alternando para aba: ${tab}`);
            }

            openSettings() {
                alert("Configurações do Zap Leve (Tema, Chaves P2P, Afiliados).");
            }

            toggleQuickReplies() {
                const textInput = document.getElementById('message-input');
                textInput.value = "🔥 Confira esta super oferta imperdível!";
                textInput.focus();
            }

            async loadMessages() {
                const container = document.getElementById('messages-container');
                container.innerHTML = `<div class="flex justify-center p-4"><i class="fa-solid fa-spinner animate-spin text-whatsapp-500 text-2xl"></i></div>`;

                try {
                    // PAGINAÇÃO E LEITURA OTIMIZADA DO FIRESTORE (Apenas Metadados)
                    const q = query(collection(db, "chats", this.currentChatId, "messages"), orderBy("timestamp", "desc"), limit(25));
                    const querySnapshot = await getDocs(q);
                    
                    container.innerHTML = "";
                    const messages = [];
                    querySnapshot.forEach((doc) => {
                        messages.unshift(doc.data());
                    });

                    if (messages.length === 0) {
                        container.innerHTML = `<div class="text-center text-slate-500 py-10">Nenhuma mensagem ainda. Envie a primeira!</div>`;
                        return;
                    }

                    messages.forEach(msg => {
                        this.renderMessageElement(msg);
                    });
                } catch (e) {
                    console.error("Erro ao carregar mensagens:", e);
                    container.innerHTML = `<div class="text-center text-red-400 py-10">Erro ao carregar histórico. Verifique suas regras do Firestore.</div>`;
                }
            }

            renderMessageElement(msg) {
                const container = document.getElementById('messages-container');
                const isMe = msg.sender === this.currentUser.uid;
                
                const div = document.createElement('div');
                div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

                let mediaContent = '';
                if (msg.mediaUrl) {
                    if (msg.mediaType === 'image') {
                        // Imagem otimizada com lazy loading nativo
                        mediaContent = `<img src="${msg.mediaUrl}" loading="lazy" class="rounded-lg max-w-xs max-h-60 object-cover mt-2 cursor-pointer" onclick="window.open('${msg.mediaUrl}', '_blank')">`;
                    } else if (msg.mediaType === 'video') {
                        // VÍDEO COM PRELOAD="NONE" (Evita consumo abusivo de dados e tráfego inicial)
                        mediaContent = `
                            <video preload="none" controls poster="${msg.thumbnailUrl || ''}" class="rounded-lg max-w-xs mt-2">
                                <source src="${msg.mediaUrl}" type="video/mp4">
                                Seu navegador não suporta vídeos.
                            </video>`;
                    } else {
                        mediaContent = `<a href="${msg.mediaUrl}" target="_blank" class="flex items-center gap-2 bg-slate-800 p-2 rounded mt-2 text-whatsapp-500 text-xs underline"><i class="fa-solid fa-file"></i> Baixar Arquivo do R2</a>`;
                    }
                }

                div.innerHTML = `
                    <div class="max-w-md rounded-lg p-3 shadow ${isMe ? 'bg-whatsapp-chat text-white rounded-tr-none' : 'bg-slate-800 text-slate-200 rounded-tl-none'}">
                        <p class="text-sm break-words">${msg.text || ''}</p>
                        ${mediaContent}
                        <span class="block text-[10px] text-slate-400 text-right mt-1">Agora</span>
                    </div>
                `;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }

            async handleMediaUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                alert(`Simulando upload direto para o Cloudflare R2: ${file.name}\n(Certifique-se de configurar seu Worker CORS para aceitar uploads).`);
                
                // Exemplo simulado de URL gerada no R2
                const mockR2Url = `${R2_PUBLIC_URL}/uploads/${Date.now()}_${file.name}`;
                const mediaType = file.type.startsWith('image') ? 'image' : (file.type.startsWith('video') ? 'video' : 'file');

                // SALVA APENAS OS METADADOS NO FIRESTORE (Economiza leituras e banda)
                try {
                    await addDoc(collection(db, "chats", this.currentChatId, "messages"), {
                        sender: this.currentUser.uid,
                        text: `[Arquivo Enviado: ${file.name}]`,
                        mediaUrl: mockR2Url,
                        mediaType: mediaType,
                        timestamp: serverTimestamp()
                    });
                    this.loadMessages();
                } catch (e) {
                    console.error("Erro ao salvar metadado no Firestore:", e);
                }
            }

            async sendMessage() {
                const input = document.getElementById('message-input');
                const text = input.value.trim();
                if (!text) return;

                input.value = "";

                try {
                    // Grava apenas texto leve no Firestore
                    await addDoc(collection(db, "chats", this.currentChatId, "messages"), {
                        sender: this.currentUser.uid,
                        text: text,
                        mediaUrl: null,
                        mediaType: null,
                        timestamp: serverTimestamp()
                    });
                    this.loadMessages();
                } catch (e) {
                    console.error("Erro ao enviar mensagem:", e);
                }
            }

            handleKeyPress(e) {
                if (e.key === 'Enter') this.sendMessage();
            }

            startCall(type) {
                alert(`Iniciando chamada P2P (${type}) via WebRTC.`);
            }
        }

        const app = new ZapLeveApp();
        window.app = app;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zap Leve</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        .container { width: 100%; height: 100%; background: white; display: flex; flex-direction: column; position: relative; }
        .hidden { display: none !important; }
        .screen-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #ffffff; width: 100%; }
        
        .app-header { display: flex; justify-content: space-between; align-items: center; background: #075e54; color: white; padding: 12px 16px; }
        .app-title-area { display: flex; align-items: center; gap: 10px; }
        .avatar-placeholder { width: 36px; height: 36px; border-radius: 50%; background: #128c7e; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        
        .contacts-list { flex: 1; overflow-y: auto; background: #fff; }
        .contact-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
        .contact-avatar { width: 45px; height: 45px; border-radius: 50%; background: #075e54; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; }
        .btn-conversar { background: #00a884; color: white; border: none; padding: 6px 12px; border-radius: 16px; font-size: 13px; cursor: pointer; }

        .chat-header { display: flex; justify-content: space-between; align-items: center; background: #075e54; color: white; padding: 10px 12px; gap: 6px; }
        .chat-header-actions { display: flex; gap: 6px; align-items: center; }
        .btn-action-top { background: #128c7e; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .btn-action-top.video { background: #25d366; }
        .btn-action-top.audio { background: #34b7f1; }
        .btn-action-top.limpar { background: #ea0938; }

        .chat-messages { flex: 1; background: #efeae2; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; word-break: break-word; font-size: 14px; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .msg-minha { background: #dcf8c6; margin-left: auto; display: flex; flex-direction: column; }
        .msg-outra { background: #fff; margin-right: auto; display: flex; flex-direction: column; }

        .chat-input-container { background: #f0f2f5; padding: 10px; border-top: 1px solid #d1d7db; display: flex; flex-direction: column; gap: 6px; }
        .chat-input-row { display: flex; gap: 8px; align-items: center; }
        .chat-input-row input { flex: 1; padding: 10px 14px; border: 1px solid #d1d7db; border-radius: 24px; outline: none; font-size: 15px; background: #fff; margin: 0; }
        .btn-clip { background: none; border: none; font-size: 22px; cursor: pointer; padding: 0 4px; color: #54656f; }
        .btn-send { background: #00a884; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .floating-cart { position: fixed; bottom: 70px; right: 20px; background: #25d366; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 100; border: none; }

        #call-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b141a; z-index: 9999; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .call-videos { display: flex; flex: 1; justify-content: center; align-items: center; position: relative; }
        .remote-video { width: 100%; max-height: 75vh; object-fit: cover; border-radius: 12px; background: #222; }
        .local-video { width: 110px; height: 150px; object-fit: cover; border-radius: 8px; position: absolute; bottom: 20px; right: 20px; border: 2px solid #fff; background: #333; }
        .call-controls { display: flex; justify-content: center; gap: 20px; padding-bottom: 20px; }
        .call-end-btn { background: #ea0938; width: 65px; height: 65px; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; border: none; color: white; cursor: pointer; }
        #file-upload-input { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="auth-screen" class="screen-content" style="justify-content: center; padding: 20px;">
            <div style="text-align: center; margin-bottom: 20px;">
                <span style="font-size: 50px;">⚡</span>
                <h1 style="color: #075e54; margin: 5px 0;">Zap Leve</h1>
            </div>
            <div style="background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <input type="email" id="email" placeholder="Seu e-mail" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:6px;">
                <input type="password" id="senha" placeholder="Sua senha" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:6px;">
                <button id="btn-login" style="width:100%; padding:12px; background:#00a884; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:10px;">Entrar / Criar Conta</button>
            </div>
        </div>

        <!-- TELA DE LISTA DE CONTACTOS -->
        <div id="contacts-screen" class="screen-content hidden">
            <div class="app-header">
                <div class="app-title-area">
                    <div id="user-avatar-initial" class="avatar-placeholder">J</div>
                    <span id="user-email-display" style="font-weight: 500; font-size: 14px;">Zap Leve ⚡</span>
                </div>
                <button id="btn-logout" class="btn-action-top limpar">Sair</button>
            </div>
            <div style="padding: 12px 16px; background: #f0f2f5; font-size: 13px; font-weight: bold; color: #54656f;">Conversas e Contactos:</div>
            <div class="contacts-list" id="list-contacts-container"></div>
            <button class="floating-cart" id="btn-floating-cart">🛒</button>
        </div>

        <!-- TELA DE CHAT -->
        <div id="chat-screen" class="screen-content hidden">
            <div class="chat-header">
                <button id="btn-voltar-lista" class="btn-action-top">← Voltar</button>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div id="chat-contact-avatar" class="avatar-placeholder" style="width: 32px; height: 32px; font-size: 14px;">R</div>
                    <span id="chat-contact-name" style="font-weight: bold; font-size: 14px;">Nome</span>
                </div>
                <div class="chat-header-actions">
                    <button id="btn-video-call" class="btn-action-top video">Vídeo</button>
                    <button id="btn-audio-call" class="btn-action-top audio">Áudio</button>
                    <button id="btn-limpar-chat" class="btn-action-top limpar">Limpar</button>
                </div>
            </div>
            <div style="padding: 6px 12px; background: #fff; border-bottom: 1px solid #ddd;">
                <input type="text" id="product-tag-input" placeholder="Produto selecionado (ex: Vestido cleidinha)" style="width:100%; padding:6px 10px; border:1px solid #ddd; border-radius:4px; font-size:13px;">
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-container">
                <div class="chat-input-row">
                    <button id="btn-clip-file" class="btn-clip">📎</button>
                    <input type="file" id="file-upload-input" accept="image/*,video/*,audio/*">
                    <input type="text" id="mensagem-input" placeholder="Mensagem ou link...">
                    <button id="btn-enviar-msg" class="btn-send">➤</button>
                </div>
            </div>
        </div>

        <!-- TELA DE CHAMADA -->
        <div id="call-screen" class="hidden">
            <div style="color: white; text-align: center; padding-top: 15px; font-weight: bold; font-size: 16px;">Chamada em Andamento...</div>
            <div class="call-videos">
                <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
                <video id="localVideo" class="local-video" autoplay playsinline muted></video>
            </div>
            <div class="call-controls">
                <button id="btn-desligar" class="call-end-btn">📞</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzi_rystX7ymNbkeifTiO-YOxx2A9UCjI",
            authDomain: "zapleve.firebaseapp.com",
            projectId: "zapleve",
            storageBucket: "zapleve.firebasestorage.app",
            messagingSenderId: "426242600158",
            appId: "1:426242600158:web:c2427064b5702948fc264f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authScreen = document.getElementById('auth-screen');
        const contactsScreen = document.getElementById('contacts-screen');
        const chatScreen = document.getElementById('chat-screen');
        const callScreen = document.getElementById('call-screen');

        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const userEmailDisplay = document.getElementById('user-email-display');
        const userAvatarInitial = document.getElementById('user-avatar-initial');
        const listContactsContainer = document.getElementById('list-contacts-container');

        const btnVoltarLista = document.getElementById('btn-voltar-lista');
        const chatContactName = document.getElementById('chat-contact-name');
        const chatContactAvatar = document.getElementById('chat-contact-avatar');
        const chatMessages = document.getElementById('chat-messages');
        const mensagemInput = document.getElementById('mensagem-input');
        const productTagInput = document.getElementById('product-tag-input');
        const btnEnviarMsg = document.getElementById('btn-enviar-msg');
        
        const btnVideoCall = document.getElementById('btn-video-call');
        const btnAudioCall = document.getElementById('btn-audio-call');
        const btnLimparChat = document.getElementById('btn-limpar-chat');
        const btnDesligar = document.getElementById('btn-desligar');
        const localVideo = document.getElementById('localVideo');
        
        const btnClipFile = document.getElementById('btn-clip-file');
        const fileUploadInput = document.getElementById('file-upload-input');
        const btnFloatingCart = document.getElementById('btn-floating-cart');

        let currentChatUser = null;
        let unsubscribeMensagens = null;
        let localStream = null;

        const contactosExemplo = [
            { nome: "julio" }, { nome: "seu-email-admin" }, { nome: "rian200905" },
            { nome: "rian20092005" }, { nome: "Carlos aguiar" }, { nome: "lipesht" },
            { nome: "pagenegocio" }, { nome: "murilosousa300709" }
        ];

        btnLogin.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const senha = senhaInput.value.trim();
            if (!email || !senha) { alert('Insira email e senha.'); return; }
            try {
                await signInWithEmailAndPassword(auth, email, senha);
            } catch (e) {
                try {
                    await createUserWithEmailAndPassword(auth, email, senha);
                } catch (err) {
                    alert('Erro: ' + err.message);
                }
            }
        });

        btnLogout.addEventListener('click', () => signOut(auth));

        function carregarContactos() {
            listContactsContainer.innerHTML = '';
            contactosExemplo.forEach(c => {
                const div = document.createElement('div');
                div.className = 'contact-item';
                div.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div class="contact-avatar">${c.nome.charAt(0).toUpperCase()}</div>
                        <span style="font-weight:500; color:#111;">${c.nome}</span>
                    </div>
                    <button class="btn-conversar">Conversar</button>
                `;
                div.addEventListener('click', () => abrirChat(c.nome));
                listContactsContainer.appendChild(div);
            });
        }

        function abrirChat(nomeContato) {
            currentChatUser = nomeContato;
            contactsScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            chatContactName.textContent = nomeContato;
            chatContactAvatar.textContent = nomeContato.charAt(0).toUpperCase();
            escutarMensagens();
        }

        btnVoltarLista.addEventListener('click', () => {
            chatScreen.classList.add('hidden');
            contactsScreen.classList.remove('hidden');
            if (unsubscribeMensagens) unsubscribeMensagens();
        });

        async function enviar(conteudo, tipo = 'texto') {
            if (!conteudo.trim()) return;
            const produtoTag = productTagInput.value.trim();
            const textoFinal = produtoTag ? `[${produtoTag}] ${conteudo}` : conteudo;
            try {
                await addDoc(collection(db, "mensagens_chat"), {
                    remetente: auth.currentUser.email,
                    destinatario: currentChatUser,
                    texto: textoFinal,
                    tipo: tipo,
                    criadoEm: serverTimestamp()
                });
                mensagemInput.value = '';
            } catch (err) {
                alert('Erro ao enviar: ' + err.message);
            }
        }

        btnEnviarMsg.addEventListener('click', () => enviar(mensagemInput.value));
        mensagemInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviar(mensagemInput.value); });

        btnClipFile.addEventListener('click', () => fileUploadInput.click());
        fileUploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    const base64Data = uploadEvent.target.result;
                    if (file.type.startsWith('image/')) {
                        enviar(`<img src="${base64Data}" style="max-width:100%; border-radius:6px; margin-top:4px;" alt="Imagem">`, 'imagem');
                    } else {
                        enviar(`📁 Ficheiro: ${file.name}`, 'ficheiro');
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        function escutarMensagens() {
            if (unsubscribeMensagens) unsubscribeMensagens();
            const q = query(collection(db, "mensagens_chat"), orderBy("criadoEm", "asc"));
            unsubscribeMensagens = onSnapshot(q, (snapshot) => {
                chatMessages.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.destinatario === currentChatUser || data.remetente === currentChatUser) {
                        const div = document.createElement('div');
                        const minha = data.remetente === auth.currentUser.email;
                        div.className = minha ? 'msg msg-minha' : 'msg msg-outra';
                        div.innerHTML = `<span style="font-size:10px; color:#555; margin-bottom:2px;">${data.remetente}</span><div>${data.texto}</div>`;
                        chatMessages.appendChild(div);
                    }
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        btnLimparChat.addEventListener('click', async () => {
            if (confirm('Deseja limpar as mensagens?')) {
                const snapshot = await getDocs(collection(db, "mensagens_chat"));
                snapshot.forEach(async (d) => { await deleteDoc(d.ref); });
            }
        });

        async function iniciarChamada(tipo) {
            callScreen.classList.remove('hidden');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: tipo === 'video', audio: true });
                localVideo.srcObject = localStream;
            } catch (err) {
                alert('Erro na câmara/microfone: ' + err.message);
                callScreen.classList.add('hidden');
            }
        }

        btnVideoCall.addEventListener('click', () => iniciarChamada('video'));
        btnAudioCall.addEventListener('click', () => iniciarChamada('audio'));
        btnDesligar.addEventListener('click', () => {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            callScreen.classList.add('hidden');
        });

        btnFloatingCart.addEventListener('click', () => alert('Loja / Carrinho do Zap Leve!'));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.classList.add('hidden');
                contactsScreen.classList.remove('hidden');
                userEmailDisplay.textContent = user.email.split('@')[0];
                userAvatarInitial.textContent = user.email.charAt(0).toUpperCase();
                carregarContactos();
            } else {
                authScreen.classList.remove('hidden');
                contactsScreen.classList.add('hidden');
                chatScreen.classList.add('hidden');
            }
        });
    </script>
</body>
</html>

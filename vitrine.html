<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vitrine Viralize — Achadinhos de todos os afiliados</title>
<meta name="description" content="Os produtos mais vistos e clicados por afiliados do Viralize — Shopee, Mercado Livre, Amazon, Shein e mais.">
<link rel="icon" type="image/png" href="/favicon.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --laranja:#ee4d2d; --laranja-escuro:#d8431f; --fundo:#f5f5f5;
    --texto:#222; --muted:#888; --borda:#eee;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--fundo);color:var(--texto);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:24px;}
  header.topo{background:linear-gradient(135deg,var(--laranja),#ff8a5c);color:#fff;padding:28px 18px 22px;text-align:center;}
  header.topo h1{margin:0 0 6px;font-size:24px;}
  header.topo p{margin:0;font-size:13px;opacity:.95;}
  .busca-fake{position:sticky;top:0;z-index:5;background:#fff;padding:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .busca-fake input{width:100%;border:1px solid var(--borda);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;box-sizing:border-box;font-family:inherit;}
  main{max-width:720px;margin:0 auto;padding:14px 12px;}
  .titulo-secao{font-size:15px;font-weight:700;margin:14px 4px 10px;}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .produto{background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--borda);text-decoration:none;color:inherit;display:flex;flex-direction:column;position:relative;}
  .produto.campeao{border:2px solid var(--laranja);box-shadow:0 0 10px 2px rgba(238,77,45,.4);}
  .produto .selo-campeao{position:absolute;top:6px;left:6px;background:linear-gradient(90deg,var(--laranja),#ff8a5c);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;z-index:2;}
  .produto img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f0f0f0;}
  .produto .info{padding:8px 10px 10px;}
  .produto .nome{font-size:12.5px;line-height:1.3;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .produto .preco{color:var(--laranja);font-weight:800;font-size:15px;margin-top:4px;}
  .produto .plataforma{font-size:10px;color:var(--muted);margin-top:2px;}
  .produto .loja-dono{font-size:10.5px;color:var(--muted);margin-top:6px;border-top:1px solid var(--borda);padding-top:6px;display:flex;align-items:center;gap:4px;}
  .vazio{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}
  .banner-cta{max-width:720px;margin:28px auto 0;padding:0 16px;text-align:center;}
  .banner-cta p{font-size:13px;color:var(--muted);margin:0 0 10px;}
  .banner-cta a{display:inline-block;background:var(--laranja);color:#fff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:24px;font-size:14px;}
</style>
</head>
<body>

<header class="topo">
  <h1>🔥 Vitrine Viralize</h1>
  <p>Os achadinhos mais vistos e clicados pelos nossos afiliados</p>
</header>

<div class="busca-fake">
  <input type="text" id="inputBusca" placeholder="🔍 Buscar um produto..." oninput="filtrarVitrine(this.value)">
</div>

<main>
  <div class="titulo-secao" id="tituloLista">🔥 Em alta agora</div>
  <div class="grade" id="listaVitrine"><div class="vazio">Carregando produtos...</div></div>
</main>

<div class="banner-cta">
  <p>É afiliado e quer seus produtos aparecendo aqui também?</p>
  <a href="/">Criar minha loja grátis no Viralize</a>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCbfAv1pw1mO0OiajQZ8_LZUIZ_u2zZIXo",
  authDomain: "viralize-ef54c.firebaseapp.com",
  projectId: "viralize-ef54c",
  storageBucket: "viralize-ef54c.firebasestorage.app",
  messagingSenderId: "52430116190",
  appId: "1:52430116190:web:081c1a40c94e21cd79ebcf"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let todosOsProdutos = [];
let campeao = { dono: null, id: null };

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function linkDaLoja(donoId, slug){
  return slug ? ('/' + slug) : ('/loja.html?uid=' + donoId);
}

function renderizarVitrine(produtos){
  const el = document.getElementById('listaVitrine');
  if(!produtos.length){
    el.innerHTML = '<div class="vazio" style="grid-column:1/-1;">Nenhum produto encontrado.</div>';
    return;
  }
  el.innerHTML = produtos.map(p => {
    const ehCampeao = p.donoId === campeao.dono && p.id === campeao.id;
    return `
    <a class="produto${ehCampeao ? ' campeao' : ''}" href="${p.lojaLink}">
      ${ehCampeao ? '<div class="selo-campeao">👑 Campeão</div>' : ''}
      <img src="${p.img}" loading="lazy">
      <div class="info">
        <div class="nome">${escapeHtml(p.nome || 'Produto')}</div>
        <div class="preco">R$ ${escapeHtml(p.preco || '--')}</div>
        <div class="plataforma">${escapeHtml(p.plataforma || 'Oferta')}</div>
        <div class="loja-dono">🏪 Ver loja de ${escapeHtml(p.nomeDono || 'Afiliado Viralize')}</div>
      </div>
    </a>`;
  }).join('');
}

function filtrarVitrine(termo){
  const t = termo.trim().toLowerCase();
  document.getElementById('tituloLista').textContent = t ? `🔍 Resultados para "${termo}"` : '🔥 Em alta agora';
  if(!t){ renderizarVitrine(todosOsProdutos); return; }
  renderizarVitrine(todosOsProdutos.filter(p => (p.nome || '').toLowerCase().includes(t)));
}

async function carregarVitrine(){
  try{
    const [configDoc, snap] = await Promise.all([
      db.collection('config').doc('recursos').get(),
      db.collectionGroup('catalogo').limit(300).get()
    ]);

    if(configDoc.exists){
      const c = configDoc.data();
      campeao = { dono: c.produtoCampeaoDono || null, id: c.produtoCampeaoId || null };
    }

    const donos = new Map(); // uid -> {nome, slug} (carregado sob demanda, uma vez por dono)
    let produtos = [];
    snap.forEach(doc => {
      const p = doc.data();
      if(p.ativo === false) return;
      if(!p.img) return;
      produtos.push({ id: doc.id, donoId: doc.ref.parent.parent.id, ...p });
    });

    // busca nome/apelido de cada afiliado dono, sem repetir consulta pro mesmo dono
    const idsUnicos = [...new Set(produtos.map(p => p.donoId))];
    await Promise.all(idsUnicos.map(async uid => {
      try{
        const d = await db.collection('usuarios').doc(uid).get();
        const dados = d.exists ? d.data() : {};
        donos.set(uid, { nome: dados.nomeLoja || dados.nome || 'Afiliado Viralize', slug: dados.slug || null });
      }catch(err){ donos.set(uid, { nome: 'Afiliado Viralize', slug: null }); }
    }));

    produtos = produtos.map(p => {
      const dono = donos.get(p.donoId) || {};
      return { ...p, nomeDono: dono.nome, lojaLink: linkDaLoja(p.donoId, dono.slug) };
    });

    // ordena pelos mais vistos/clicados primeiro (prova social de verdade)
    produtos.sort((a, b) => ((b.cliques||0) + (b.visualizacoesViral||0)) - ((a.cliques||0) + (a.visualizacoesViral||0)));

    todosOsProdutos = produtos.slice(0, 120);
    renderizarVitrine(todosOsProdutos);
  }catch(err){
    console.error(err);
    document.getElementById('listaVitrine').innerHTML = '<div class="vazio" style="grid-column:1/-1;">Não foi possível carregar a vitrine agora. Tente de novo em instantes.</div>';
  }
}

carregarVitrine();
</script>
</body>
</html>
